---
# playbooks/playbook.yml
#
# Glavni playbook. Svaki play cilja tacno jednu namensku inventory
# grupu i pokrece jednu rolu.
#
# Aktivacija:
#   1. Host se upisuje u grupu u inventory/hosts.ini
#   2. Grupi pripada group_vars/<grupa>.yml koji postavlja
#      role_<ime>_enabled: true
#
# Oba dolaze iz bootstrap sablona. U svakodnevnom radu menja se
# samo hosts.ini.
#
# Prefiks grupe:
#   apply_   — menja stanje onoga sto vec postoji (konfiguracija)
#   deploy_  — donosi nesto novo na sistem (instalacija)
#
# Pokretanje ide preko apply.sh iz radnog foldera:
#   ./apply.sh --check --diff --limit <host>


# =====================================================================
# OSNOVNA KONFIGURACIJA SISTEMA
# =====================================================================

- name: Apply timezone configuration
  hosts: apply_timezone
  become: yes
  roles:
    - timezone

- name: Configure login banner
  hosts: apply_banner
  become: yes
  roles:
    - banner

# PAZNJA: pogresna pravila mogu prekinuti SSH pristup.
- name: Configure firewall
  hosts: apply_firewall
  become: yes
  roles:
    - firewall

# Rola se zove etc_hosts jer je "hosts" rezervisana rec u playbook
# sintaksi.
- name: Configure /etc/hosts
  hosts: apply_etc_hosts
  become: yes
  roles:
    - etc_hosts

- name: Configure users
  hosts: apply_users
  become: yes
  roles:
    - users


# =====================================================================
# PAKETI I REPOZITORIJUMI
# =====================================================================
# Redosled je bitan: repos mora ici PRE packages i updates.
# Instalacija iz repozitorijuma koji jos nije dodat bi pala.

- name: Configure package repositories
  hosts: apply_repos
  become: yes
  roles:
    - repos

- name: Install packages
  hosts: deploy_packages
  become: yes
  roles:
    - packages

# serial: 1 — host po host, da azuriranje ne obori celu grupu.
- name: Update packages
  hosts: apply_updates
  serial: 1
  become: yes
  roles:
    - updates


# =====================================================================
# SERTIFIKATI
# =====================================================================

- name: Deploy Root CA
  hosts: deploy_root_ca
  become: yes
  roles:
    - root_ca


# =====================================================================
# ZABBIX
# =====================================================================

- name: Deploy Zabbix Agent
  hosts: deploy_zabbix_agent
  become: yes
  roles:
    - zabbix_agent

- name: Deploy Zabbix Database
  hosts: deploy_zabbix_db
  become: yes
  roles:
    - zabbix_db

- name: Deploy Zabbix Server
  hosts: deploy_zabbix_server
  become: yes
  roles:
    - zabbix_server

- name: Deploy Zabbix Web
  hosts: deploy_zabbix_web
  become: yes
  roles:
    - zabbix_web

- name: Deploy Zabbix Proxy
  hosts: deploy_zabbix_proxy
  become: yes
  roles:
    - zabbix_proxy

- name: Selenium WebDriver za Zabbix browser stavke
  hosts: deploy_zabbix_webdriver
  become: true
  roles:
    - zabbix_webdriver
