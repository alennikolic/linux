# bootstrap/template/ansible.cfg
#
# Konfiguracija radnog foldera.
#
# Putanju roles_path upisuje bootstrap/init.sh prilikom inicijalizacije.
# Ako premestis repozitorijum ili ovaj folder, izmeni je rucno.

[defaults]
inventory           = ./inventory
roles_path          = @@ROLES_PATH@@

# Nalog pod kojim se Ansible povezuje na ciljne sisteme. Kreira ga
# rola ansible_user kroz playbooks/bootstrap.yml.
#
# Ako si promenio role_ansible_user_name, izmeni i ovde — inace ce
# Ansible koristiti ime lokalnog korisnika i konekcija nece raditi.
#
# Bootstrap se pokrece sa --user root (ili drugim postojecim nalogom),
# sto privremeno nadjacava vrednost ispod.
remote_user         = ansible

# Ne prihvataj tiho nepoznate SSH host kljuceve.
host_key_checking   = True

# Ne pogadjaj Python interpreter naglas pri svakom pokretanju.
interpreter_python  = auto_silent

# .retry fajlovi se u praksi retko koriste, a zatrpavaju folder.
retry_files_enabled = False

# Citljiviji ispis izmena.
stdout_callback     = yaml

# Paralelizam. Povecaj ako imas mnogo hostova i dovoljno resursa.
forks               = 10

# Kesiranje fact-ova ubrzava ponovljena pokretanja.
gathering           = smart
fact_caching        = jsonfile
fact_caching_connection = ./.facts
fact_caching_timeout    = 3600

[ssh_connection]
# Ponovna upotreba SSH konekcije — znacajno ubrzanje.
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s
pipelining   = True

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

# Rola ansible_user podrazumevano postavlja sudo bez lozinke, pa
# ovo ostaje False. Ako si iskljucio NOPASSWD, pokreni apply.sh sa
# --ask-become-pass umesto da menjas vrednost ispod.
become_ask_pass = False
