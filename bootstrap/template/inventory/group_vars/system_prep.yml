---
# bootstrap/template/inventory/group_vars/system_prep.yml
#
# Aktivacija role "system_prep" za sve hostove u grupi [system_prep].
#
# Ovaj fajl NE treba menjati. Rolu ukljucujes tako sto host upises
# u grupu [system_prep] u hosts.ini, a ne izmenom vrednosti ispod.
#
# Za izuzetak po pojedinacnom hostu koristi host_vars:
#   host_vars/<host>.yml
#     role_system_prep_enabled: false
#
# Parametre role (kako se izvrsava, ne da li) menjaj u
# group_vars/all.yml ili host_vars/<host>.yml.
#
# PAZNJA: rola je destruktivna — priprema sistem za pravljenje
# sablona (brisanje machine-id, SSH host kljuceva, logova).
# NE primenjivati na produkcijske hostove.

role_system_prep_enabled: true
