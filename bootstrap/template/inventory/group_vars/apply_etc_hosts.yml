---
# bootstrap/template/inventory/group_vars/apply_etc_hosts.yml
#
# Aktivacija role "etc_hosts" za sve hostove u grupi [apply_etc_hosts].
#
# Rola se zove etc_hosts, a ne hosts, jer je "hosts" rezervisana rec
# u Ansible playbook sintaksi.
#
# Ovaj fajl NE treba menjati. Rolu ukljucujes tako sto host upises
# u grupu [apply_etc_hosts] u hosts.ini, a ne izmenom vrednosti ispod.
#
# Za izuzetak po pojedinacnom hostu koristi host_vars:
#   host_vars/<host>.yml
#     role_etc_hosts_enabled: false
#
# Parametre role (kako se izvrsava, ne da li) menjaj u
# group_vars/all.yml ili host_vars/<host>.yml.

role_etc_hosts_enabled: true
