---
# bootstrap/template/inventory/group_vars/deploy_root_ca.yml
#
# Aktivacija role "root_ca" za sve hostove u grupi [deploy_root_ca].
#
# Ovaj fajl NE treba menjati. Rolu ukljucujes tako sto host upises
# u grupu [deploy_root_ca] u hosts.ini, a ne izmenom vrednosti ispod.
#
# Za izuzetak po pojedinacnom hostu koristi host_vars:
#   host_vars/<host>.yml
#     role_root_ca_enabled: false
#
# Parametre role (kako se izvrsava, ne da li) menjaj u
# group_vars/all.yml ili host_vars/<host>.yml.

role_root_ca_enabled: true
