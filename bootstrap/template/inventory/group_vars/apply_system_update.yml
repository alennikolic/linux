---
# bootstrap/template/inventory/group_vars/apply_system_update.yml
#
# Aktivacija role "system_update" za sve hostove u grupi
# [apply_system_update].
#
# Ovaj fajl NE treba menjati. Rolu ukljucujes tako sto host upises
# u grupu [apply_system_update] u hosts.ini, a ne izmenom vrednosti
# ispod.
#
# Za izuzetak po pojedinacnom hostu koristi host_vars:
#   host_vars/<host>.yml
#     role_system_update_enabled: false
#
# Parametre role (kako se izvrsava, ne da li) menjaj u
# group_vars/all.yml ili host_vars/<host>.yml.

role_system_update_enabled: true
