---
# bootstrap/template/inventory/group_vars/deploy_zabbix_proxy.yml
#
# Aktivacija role "zabbix_proxy" za sve hostove u grupi
# [deploy_zabbix_proxy].
#
# Ovaj fajl NE treba menjati. Rolu ukljucujes tako sto host upises
# u grupu [deploy_zabbix_proxy] u hosts.ini, a ne izmenom vrednosti
# ispod.
#
# Za izuzetak po pojedinacnom hostu koristi host_vars:
#   host_vars/<host>.yml
#     role_zabbix_proxy_enabled: false
#
# Parametre role (kako se izvrsava, ne da li) menjaj u
# group_vars/all.yml ili host_vars/<host>.yml.

role_zabbix_proxy_enabled: true
