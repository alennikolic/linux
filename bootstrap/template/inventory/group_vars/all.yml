---
# bootstrap/template/inventory/group_vars/all.yml
#
# Globalni parametri koji vaze za sve hostove.
#
# VAZNO: ovde NE idu role_<ime>_enabled prekidaci. Aktivacija role ide
# iskljucivo kroz clanstvo hosta u odgovarajucoj grupi u hosts.ini.
# Ovde idu samo parametri — kako se rola izvrsava, ne da li.
#
# Prioritet (od najniseg ka najvisem):
#   roles/<rola>/defaults/main.yml
#   group_vars/all.yml          <- ovaj fajl
#   group_vars/<grupa>.yml
#   host_vars/<host>.yml
#
# Spisak dostupnih parametara za svaku rolu nalazi se u njenom
# defaults/main.yml, sa komentarima i primerima.


# ---------------------------------------------------------------------
# Parametri konekcije
# ---------------------------------------------------------------------
# ansible_user: admin
# ansible_ssh_private_key_file: ~/.ssh/id_ed25519
# ansible_python_interpreter: /usr/bin/python3


# ---------------------------------------------------------------------
# Primeri globalnih parametara rola
# ---------------------------------------------------------------------
# Odkomentarisi i prilagodi po potrebi.

# role_timezone_name: Europe/Belgrade

# Rola "timezone" upisuje ceo /etc/chrony/chrony.conf, pa je lista
# izvora OBAVEZNA za svaki host u grupi [apply_timezone]. Bez nje
# rola prekida rad.
#
# Interni izvori:
# role_timezone_ntp_servers:
#   - ntp1.example.com
#   - ntp2.example.com
#
# Javni pool — uz role_timezone_ntp_source_type: pool
# role_timezone_ntp_source_type: pool
# role_timezone_ntp_servers:
#   - 0.pool.ntp.org
#   - 1.pool.ntp.org

# role_banner_text: |
#   *****************************************************************
#   * UPOZORENJE: Pristup samo za ovlascena lica                    *
#   * Host: {{ inventory_hostname }}
#   * Sve aktivnosti se beleze.                                     *
#   *****************************************************************


# ---------------------------------------------------------------------
# Bootstrap: SSH kljuc kontrolnog cvora
# ---------------------------------------------------------------------
# OBAVEZNO pre pokretanja playbooks/bootstrap.yml.
#
# Upisi javni kljuc kontrolnog cvora u celosti, u jednoj liniji.
# Procitas ga sa:
#   cat ~/.ssh/id_ed25519.pub
#
# Ako kljuc jos ne postoji:
#   ssh-keygen -t ed25519 -C "ansible@control"

role_ansible_user_ssh_key: ""
