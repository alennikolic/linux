---
# bootstrap/template/inventory/group_vars/deploy_zabbix_agent.yml
#
# Aktivacija role "zabbix_agent" za sve hostove u grupi
# [deploy_zabbix_agent].
#
# Ovaj fajl NE treba menjati. Rolu ukljucujes tako sto host upises
# u grupu [deploy_zabbix_agent] u hosts.ini, a ne izmenom vrednosti
# ispod.
#
# Za izuzetak po pojedinacnom hostu koristi host_vars:
#   host_vars/<host>.yml
#     role_zabbix_agent_enabled: false
#
# Parametre role (kako se izvrsava, ne da li) menjaj u
# group_vars/all.yml ili host_vars/<host>.yml.

role_zabbix_agent_enabled: true
