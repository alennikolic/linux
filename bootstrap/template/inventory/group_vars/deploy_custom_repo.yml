---
# bootstrap/template/inventory/group_vars/deploy_custom_repo.yml
#
# Aktivacija role "custom_repo" za sve hostove u grupi
# [deploy_custom_repo].
#
# Ovaj fajl NE treba menjati. Rolu ukljucujes tako sto host upises
# u grupu [deploy_custom_repo] u hosts.ini, a ne izmenom vrednosti
# ispod.
#
# Za izuzetak po pojedinacnom hostu koristi host_vars:
#   host_vars/<host>.yml
#     role_custom_repo_enabled: false
#
# Parametre role (kako se izvrsava, ne da li) menjaj u
# group_vars/all.yml ili host_vars/<host>.yml.

role_custom_repo_enabled: true
