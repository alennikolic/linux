---
# bootstrap/template/inventory/group_vars/package_manager.yml
#
# Aktivacija role "package_manager" za sve hostove u grupi
# [package_manager].
#
# Ovaj fajl NE treba menjati. Rolu ukljucujes tako sto host upises
# u grupu [package_manager] u hosts.ini, a ne izmenom vrednosti ispod.
#
# Za izuzetak po pojedinacnom hostu koristi host_vars:
#   host_vars/<host>.yml
#     role_package_manager_enabled: false
#
# Parametre role (kako se izvrsava, ne da li) menjaj u
# group_vars/all.yml ili host_vars/<host>.yml.

role_package_manager_enabled: true
