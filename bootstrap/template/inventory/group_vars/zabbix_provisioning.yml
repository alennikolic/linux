---
# bootstrap/template/inventory/group_vars/zabbix_provisioning.yml
#
# Aktivacija role "zabbix_provisioning" za sve hostove u grupi
# [zabbix_provisioning].
#
# Ovaj fajl NE treba menjati. Rolu ukljucujes tako sto host upises
# u grupu [zabbix_provisioning] u hosts.ini, a ne izmenom vrednosti
# ispod.
#
# Za izuzetak po pojedinacnom hostu koristi host_vars:
#   host_vars/<host>.yml
#     role_zabbix_provisioning_enabled: false
#
# Parametre role (kako se izvrsava, ne da li) menjaj u
# group_vars/all.yml ili host_vars/<host>.yml.

role_zabbix_provisioning_enabled: true
