---
# roles/zabbix_server/defaults/main.yml

# ============================================================================
# Rola: zabbix_server
#
# Instalira Zabbix server i upisuje SVOJU konfiguraciju kao drop-in fajl u
# /etc/zabbix/zabbix_server.d/, umesto da prepisuje glavni konfiguracioni
# fajl.
#
# Zasto drop-in:
#   - /etc/zabbix/zabbix_server.conf je dpkg conffile od preko hiljadu linija.
#     Rola koja ga prepisuje pravi konflikt pri svakoj nadogradnji paketa i
#     mora se dopunjavati za svaki novi parametar koji Zabbix uvede.
#   - Zabbix obradjuje Include direktivu u trenutku kad je procita. Kada je
#     Include na kraju glavnog fajla, vrednosti iz drop-ina nadjacavaju
#     podrazumevane.
#
# RAZLIKA U ODNOSU NA AGENTA: zabbix_server.conf u paketu NEMA aktivnu
# Include liniju - sve su zakomentarisane, i to sa upstream putanjom
# /usr/local/etc/. Rola je zato dodaje sama, kao jednu liniju na kraj fajla
# (vidi role_zabbix_server_manage_include).
#
# Rola bazu NE dira. Ne kreira je, ne uvozi semu, ne menja privilegije - samo
# upisuje podatke o vezi. Ceo posao nad bazom radi rola "zabbix_db".
# ============================================================================

# ---------------------------------------------------------------------------
# Aktivacija i paket
# ---------------------------------------------------------------------------

# Prekidac role. Postavlja ga group_vars/deploy_zabbix_server.yml.
role_zabbix_server_enabled: false

# "mysql" ili "pgsql". Odredjuje samo ime paketa (zabbix-server-mysql /
# zabbix-server-pgsql). Rola "zabbix_db" pokriva iskljucivo MySQL - uz pgsql
# bazu, semu i naloge pripremas sam.
role_zabbix_server_db_backend: mysql

# Zakovana verzija paketa. Prazno = najnovija iz repozitorijuma.
#   role_zabbix_server_version: "1:7.0.9-1+ubuntu24.04"
# Dostupne verzije: apt-cache madison zabbix-server-mysql
role_zabbix_server_version: ""

# ---------------------------------------------------------------------------
# Veza sa bazom
#
# Ovi parametri su izdvojeni iz opsteg recnika namerno: bez njih server ne
# startuje, pa nad njima postoji assert. Da su u recniku, korisnik koji u
# group_vars definise role_zabbix_server_config potpuno bi zamenio
# podrazumevani recnik (Ansible ne spaja recnike) i tiho ostao bez lozinke.
# ---------------------------------------------------------------------------

# IP adresa ili ime hosta baze. Prazna vrednost znaci lokalni unix socket.
#
# PAZNJA: "localhost" MySQL klijent tumaci kao unix socket i IGNORISE DBPort.
# Za bazu na drugom hostu obavezno upisi IP adresu.
role_zabbix_server_db_host: localhost

# Upisuje se u konfiguraciju samo kada host nije localhost.
role_zabbix_server_db_port: 3306

role_zabbix_server_db_name: zabbix
role_zabbix_server_db_user: zabbix

# OBAVEZNO. Mora biti ISTA vrednost kao role_zabbix_db_password na hostu
# baze. Pripada host_vars ili vault-u, nikako ovom fajlu.
role_zabbix_server_db_password: ""

# Putanja do unix socket-a. Samo uz lokalnu bazu i samo ako podrazumevana
# putanja ne odgovara.
role_zabbix_server_db_socket: ""

# ---------------------------------------------------------------------------
# Ostali parametri konfiguracije
# ---------------------------------------------------------------------------

# Slobodan recnik parametara koji se doslovno prepisuju u drop-in fajl.
# Kljuc je ime Zabbix parametra (osetljivo na velika/mala slova), vrednost je
# skalar ili lista. Lista se ispisuje kao vise linija sa istim kljucem - to
# treba za parametre koji se legitimno ponavljaju.
#
# Sve sto nije ovde nabrojano ostaje na vrednosti iz stock konfiguracije, pa
# recnik drzi samo ono sto stvarno odstupa.
#
# Primer za okruzenje srednje velicine:
#   role_zabbix_server_config:
#     ListenPort: 10051
#     CacheSize: 128M
#     HistoryCacheSize: 64M
#     ValueCacheSize: 64M
#     StartPollers: 20
#     StartPreprocessors: 10
#     StartTrappers: 10
#     Timeout: 10
#     LogSlowQueries: 3000
#     StatsAllowedIP: 127.0.0.1
#
# Visoka dostupnost (svaki cvor dobija jedinstveno ime, svi dele istu bazu):
#   role_zabbix_server_config:
#     HANodeName: node-01
#     NodeAddress: "10.0.0.50:10051"
#
# NAPOMENE:
#   - ne koristi YAML true/false - Jinja ih ispisuje kao "True"/"False", sto
#     Zabbix ne razume; koristi 0 i 1
#   - svaki poller/trapper trosi jednu konekciju ka bazi; zbir svih procesa
#     ne sme preci max_connections (role_zabbix_db_max_connections)
#   - kljucevi DBHost, DBName, DBUser, DBPassword, DBSocket, DBPort i Include
#     su rezervisani i assert prekida ako se nadju ovde
role_zabbix_server_config: {}

# Slobodan tekst koji se dodaje na kraj drop-in fajla, doslovno.
# Izlaz u nuzdu za sve sto se ne uklapa u recnik.
#
#   role_zabbix_server_extra_config: |
#     SNMPTrapperFile=/var/log/snmptrap/snmptrap.log
#     StartSNMPTrapper=1
role_zabbix_server_extra_config: ""

# ---------------------------------------------------------------------------
# Drop-in mehanizam
# ---------------------------------------------------------------------------

# Direktorijum u koji ide drop-in. Za razliku od agenta, ovde se putanja NE
# otkriva - paket je ne definise, pa je rola propisuje.
role_zabbix_server_include_dir: /etc/zabbix/zabbix_server.d

# Ime drop-in fajla. Prefiks "zz-" nema funkciju (Zabbix ne cita include
# fajlove abecedno), ali jasno oznacava da je fajl pod tudjom upravom.
role_zabbix_server_dropin_name: zz-ansible.conf

# Kada je true, rola u glavnu konfiguraciju dodaje liniju
#   Include=<role_zabbix_server_include_dir>/*.conf
# na sam kraj fajla, u bloku sa Ansible markerima.
#
# To je JEDINA izmena glavnog fajla koju rola pravi. Bez nje drop-in nikada
# ne bi bio ucitan, jer paket nema aktivnu Include direktivu.
#
# Postavi na false samo ako Include liniju odrzavas drugim putem. Rola tada
# proverava da li je drop-in uopste dohvatljiv i prekida ako nije.
role_zabbix_server_manage_include: true

# ---------------------------------------------------------------------------
# Servis
# ---------------------------------------------------------------------------

role_zabbix_server_service_enabled: true
role_zabbix_server_service_state: started
