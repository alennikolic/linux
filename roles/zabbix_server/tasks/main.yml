---
# roles/zabbix_server/tasks/main.yml
#
#   1. Provere
#   2. Instalacija paketa
#   3. Konfiguracioni fajl
#   4. Servis
#
# Rola bazu NE dira. Ne kreira je, ne uvozi semu, ne menja
# privilegije — samo upisuje podatke o vezi u konfiguraciju. Ceo
# posao nad bazom radi rola "zabbix_db", na hostu baze.

- name: "Instalacija i konfiguracija Zabbix servera"
  block:

    # -----------------------------------------------------------------
    # 1. Provere
    # -----------------------------------------------------------------

    - name: "Provera da je distribucija podrzana"
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          Rola "zabbix_server" trenutno podrzava iskljucivo
          Debian/Ubuntu, a ovaj host je
          {{ ansible_os_family | default('nepoznat') }}.
        success_msg: "Distribucija je podrzana."

    - name: "Provera izbora backend-a"
      ansible.builtin.assert:
        that:
          - role_zabbix_server_db_backend in ['mysql', 'pgsql']
        fail_msg: >-
          role_zabbix_server_db_backend mora biti "mysql" ili "pgsql",
          a zadato je "{{ role_zabbix_server_db_backend }}".
        success_msg: "Backend je ispravan."

    - name: "Provera da je lozinka baze zadata"
      ansible.builtin.assert:
        that:
          - role_zabbix_server_db_password is defined
          - role_zabbix_server_db_password | length > 0
        fail_msg: >-
          role_zabbix_server_db_password nije popunjen. Upisi ga u
          host_vars/<host>.yml na kontrolnom cvoru. Mora biti ISTA
          vrednost kao role_zabbix_db_password na hostu baze.
        success_msg: "Lozinka baze je zadata."

    # Ime hosta "localhost" MySQL klijent tumaci kao unix socket i
    # ignorise DBPort. Za bazu na drugom hostu to znaci da se server
    # tiho pokusava povezati lokalno i pada sa nejasnom greskom.
    - name: "Provera da udaljena baza nije zadata kao localhost"
      ansible.builtin.assert:
        that:
          - role_zabbix_server_db_socket | length == 0
        fail_msg: >-
          role_zabbix_server_db_host je "localhost", ali je zadat i
          role_zabbix_server_db_socket. Za bazu na drugom hostu upisi
          IP adresu u role_zabbix_server_db_host i ostavi socket
          prazan.
        success_msg: "Podesavanja veze sa bazom su konzistentna."
      when: role_zabbix_server_db_host == 'localhost'

    # -----------------------------------------------------------------
    # 2. Instalacija
    # -----------------------------------------------------------------
    # Paket zabbix-sql-scripts se ovde vise NE instalira — dolazi uz
    # rolu "zabbix_db", na hostu baze, gde se sema i uvozi.
    #
    # Ako paket nije dostupan, gotovo uvek znaci da Zabbix
    # repozitorijum nije dodat. Originalna apt greska ostaje u ispisu,
    # a rescue grana ispod dodaje objasnjenje sta proveriti.

    - name: "Instalacija Zabbix servera"
      block:

        - name: "Instalacija paketa {{ _zabbix_server_package }}"
          ansible.builtin.apt:
            name: >-
              {{ _zabbix_server_package }}{{
                 '=' ~ role_zabbix_server_version
                 if role_zabbix_server_version | length > 0 else '' }}
            state: present
            update_cache: true
            cache_valid_time: 3600
          notify: "Restartuj Zabbix server"

      rescue:

        - name: "Objasnjenje neuspele instalacije"
          ansible.builtin.fail:
            msg: >-
              Instalacija paketa "{{ _zabbix_server_package }}" nije
              uspela. Najcesci uzrok je da Zabbix repozitorijum nije
              dodat — host mora biti i u grupi [apply_repos], a
              apply_repos mora ici pre deploy_zabbix_server u
              playbook.yml. Proveri sa:
              apt-cache policy {{ _zabbix_server_package }}
              Druga mogucnost je zakovana verzija koja u
              repozitorijumu ne postoji; dostupne vidis sa:
              apt-cache madison {{ _zabbix_server_package }}

    # -----------------------------------------------------------------
    # 3. Konfiguracija
    # -----------------------------------------------------------------
    # Fajl sadrzi lozinku baze, pa ima dozvole 0640 i grupu zabbix.
    # no_log: true znaci da --diff nece prikazati razliku; to je cena
    # zastite lozinke.

    - name: "Upis konfiguracionog fajla"
      ansible.builtin.template:
        src: zabbix_server.conf.j2
        dest: "{{ _zabbix_server_config_file }}"
        owner: root
        group: zabbix
        mode: '0640'
        backup: true
      no_log: true
      notify: "Restartuj Zabbix server"

    # -----------------------------------------------------------------
    # 4. Servis
    # -----------------------------------------------------------------

    - name: "Servis {{ _zabbix_server_service }}"
      ansible.builtin.service:
        name: "{{ _zabbix_server_service }}"
        enabled: "{{ role_zabbix_server_service_enabled | bool }}"
        state: "{{ role_zabbix_server_service_state }}"

  when: role_zabbix_server_enabled | default(false) | bool
