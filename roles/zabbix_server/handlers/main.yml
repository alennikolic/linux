---
# roles/zabbix_server/handlers/main.yml
#
# Restart, ne reload. Zabbix server na SIGHUP ponovo cita samo deo
# parametara, a sintaksna greska u include fajlu sprecava pokretanje -
# bolje je da to odmah bude vidljivo.

- name: "Restartuj Zabbix server"
  ansible.builtin.service:
    name: "{{ _zabbix_server_service }}"
    state: restarted
  when: role_zabbix_server_service_state != 'stopped'
