---
# roles/zabbix_web/vars/main.yml
#
# Izvedene vrednosti. Ovo NISU podesavanja — ne menjaj ih kroz
# group_vars ili host_vars.
#
# Posle prelaska na iskljucivo Nginx ovde vise nema uslovnih izraza —
# sve vrednosti su fiksne. Fajl ostaje jer putanje i imena paketa
# nisu podesavanja i nemaju sta da traze u defaults/main.yml.

_zabbix_web_frontend_package: zabbix-frontend-php
_zabbix_web_conf_package: zabbix-nginx-conf

_zabbix_web_service: nginx

# Paket zabbix-nginx-conf isporucuje ovaj fajl i pravi vezu ka njemu
# iz /etc/nginx/conf.d/zabbix.conf. Rola prepisuje njegov sadrzaj.
_zabbix_web_vhost_file: /etc/zabbix/nginx.conf

_zabbix_web_config_file: /etc/zabbix/web/zabbix.conf.php

# PHP-FPM socket iz pool-a koji dolazi uz zabbix-nginx-conf.
_zabbix_web_php_socket: /run/php/zabbix.sock
