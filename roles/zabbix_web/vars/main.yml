---
# roles/zabbix_web/vars/main.yml
#
# Izvedene vrednosti. Ovo NISU podesavanja — ne menjaj ih kroz
# group_vars ili host_vars.

_zabbix_web_frontend_package: zabbix-frontend-php
_zabbix_web_conf_package: zabbix-nginx-conf

_zabbix_web_service: nginx

# ---------------------------------------------------------------------
# Vendorovi fajlovi — ROLA IH NE DIRA
# ---------------------------------------------------------------------
# Oba su dpkg conffile. Ostaju na disku tacno onakvi kakvi su iz
# paketa dosli, sto znaci: nikad pitanje pri nadogradnji, i uvek
# dostupna referenca sa kojom mozes uporediti nasu konfiguraciju.
#
_zabbix_web_vendor_vhost: /etc/zabbix/nginx.conf
_zabbix_web_vendor_pool: /etc/zabbix/php-fpm.conf

# ---------------------------------------------------------------------
# Veze koje ih aktiviraju — ROLA IH UKLANJA
# ---------------------------------------------------------------------
# Ove veze pravi postinst skripta paketa, NISU conffile. Njihovo
# uklanjanje ne menja stanje nijednog fajla koji dpkg prati, a
# iskljucuje vendorovu konfiguraciju iz upotrebe.
#
# Vendorov vhost mora nestati iz upotrebe: njegov server blok je
# aktivan, sa zakomentarisanim "listen" pa Nginx pretpostavlja port
# 80 i taj blok postaje podrazumevani server. Uporedo sa nasim to
# daje nepredvidivo ponasanje.
#
_zabbix_web_vendor_vhost_link: /etc/nginx/conf.d/zabbix.conf

# ---------------------------------------------------------------------
# Podrazumevani Nginx sajt — ROLA GA UKLANJA
# ---------------------------------------------------------------------
# Ubuntu paket "nginx" isporucuje sites-available/default i kroz
# postinst pravi vezu u sites-enabled. Taj server blok slusa na
# "80 default_server", sto daje dva problema:
#
#   1. Na hostu gde neko drugi vec drzi port 80 (npr. Apache, koji
#      Zabbix povlaci kao zavisnost php paketa) Nginx uopste ne
#      startuje — poruka je "Address already in use" i ne pominje
#      ovaj fajl.
#   2. I kada startuje, na portu 80 stoji Nginx pozdravna stranica
#      dok je Zabbix na role_zabbix_web_listen_port. Pri prvom
#      postavljanju to izgleda kao da rola nije odradila posao.
#
# Ovo je VEZA, ne conffile — isti slucaj kao vendorove Zabbix veze,
# pa se uklanja po istom pravilu. Fajl u sites-available ostaje.
#
_zabbix_web_nginx_default_site: /etc/nginx/sites-enabled/default

# ---------------------------------------------------------------------
# Nasi fajlovi
# ---------------------------------------------------------------------
# Imena se namerno razlikuju od vendorovih. Paket ih nikad nece
# dodirnuti, a i da postinst ponovo napravi svoje veze, nasi fajlovi
# ostaju netaknuti.
#
_zabbix_web_vhost_file: /etc/nginx/conf.d/zabbix-ansible.conf

# Ime pool-a se razlikuje od vendorovog ("zabbix"). Dva pool-a sa
# istim imenom sprecavaju pokretanje CELOG php-fpm servisa, ne samo
# tog pool-a — razlicito ime cini uklanjanje veze bezopasnim ako
# zakaze.
_zabbix_web_pool_name: zabbix-ansible
_zabbix_web_php_socket: /run/php/zabbix-ansible.sock

_zabbix_web_config_file: /etc/zabbix/web/zabbix.conf.php

# ---------------------------------------------------------------------
# Putanje izvedene iz otkrivene verzije PHP-a
# ---------------------------------------------------------------------
# Ansible vrednosti u vars/ racuna tek kad zatrebaju, pa smeju da se
# oslanjaju na cinjenicu koju rola postavlja u toku rada.
#
_zabbix_web_php_conf_dir: "/etc/php/{{ _zabbix_web_php_version }}/fpm"
_zabbix_web_pool_file: "{{ _zabbix_web_php_conf_dir }}/pool.d/zabbix-ansible.conf"

# PAZNJA NA IME. Veza koju pravi postinst paketa zabbix-nginx-conf
# NE zove se "zabbix.conf" nego "zabbix-php-fpm.conf":
#
#   zabbix-php-fpm.conf -> /etc/zabbix/php-fpm.conf
#
# Nginx strana koristi kratko ime ("zabbix.conf"), PHP strana dugo.
# Ranija verzija role je i ovde ocekivala kratko, pa je task za
# uklanjanje brisao putanju koja ne postoji, prijavljivao "ok", a
# vendorov pool je nastavljao da radi uporedo sa nasim — do 50
# suvisnih procesa i socket /run/php/zabbix.sock koji nikom ne treba.
#
_zabbix_web_vendor_pool_link: "{{ _zabbix_web_php_conf_dir }}/pool.d/zabbix-php-fpm.conf"

_zabbix_web_php_service: "php{{ _zabbix_web_php_version }}-fpm"
_zabbix_web_php_fpm_binary: "/usr/sbin/php-fpm{{ _zabbix_web_php_version }}"

# Fajl iz ranije verzije role. Upisivao je PHP vrednosti u conf.d,
# gde ih je vendorov pool pregazio — nikad nije radio. Rola ga sada
# uklanja.
_zabbix_web_legacy_ini: "{{ _zabbix_web_php_conf_dir }}/conf.d/99-zabbix.ini"

# ---------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------

# CSR za self-signed sertifikat. Ime se izvodi iz putanje kljuca
# zamenom ekstenzije, da bi pratilo eventualnu izmenu te putanje.
_zabbix_web_tls_csr: >-
  {{ role_zabbix_web_tls_key | regex_replace('\.[^./]+$', '') }}.csr

# Subject self-signed sertifikata. Prazna polja se izbacuju —
# openssl_csr bi ih inace upisao kao prazne atribute.
_zabbix_web_tls_subject: >-
  {{ {
       'CN': role_zabbix_web_tls_selfsigned_cn,
       'O':  role_zabbix_web_tls_selfsigned_org,
     }
     | dict2items | rejectattr('value', 'equalto', '') | items2dict }}

# SAN lista. Unos za sam CN se dodaje automatski: kao IP: kada je CN
# IPv4 adresa, inace kao DNS:.
#
# Izraz je namerno jedan Jinja izraz u presavijenom bloku — Ansible
# cuva tip vrednosti (listu) samo u tom obliku. Razbijen na vise
# izraza rezultat bi bio string.
_zabbix_web_tls_sans: >-
  {{ ([(('IP:' ~ role_zabbix_web_tls_selfsigned_cn)
         if role_zabbix_web_tls_selfsigned_cn is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
         else ('DNS:' ~ role_zabbix_web_tls_selfsigned_cn))]
      + role_zabbix_web_tls_selfsigned_sans) | unique | list }}
