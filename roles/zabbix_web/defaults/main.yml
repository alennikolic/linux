---
# roles/zabbix_web/defaults/main.yml
#
# Rola "zabbix_web" instalira i konfigurise Zabbix web frontend na
# Nginx-u.
#
# Aktivacija ide preko clanstva hosta u grupi [deploy_zabbix_web],
# koja kroz group_vars/deploy_zabbix_web.yml postavlja
# role_zabbix_web_enabled.
#
# PREDUSLOVI:
#   1. Zabbix repozitorijum — rola "repos", grupa [apply_repos]
#   2. Baza sa uvezenom semom — rola "zabbix_db"
#
# Frontend NE mora biti na istom hostu kao Zabbix server, ali mora
# imati mrezni pristup do BAZE. Frontend cita bazu direktno, ne kroz
# server.
#
# Rola upisuje zabbix.conf.php i time preskace carobnjak za
# instalaciju koji se inace pojavljuje pri prvom otvaranju frontenda.
#
# APACHE VISE NIJE PODRZAN. Rola radi iskljucivo sa Nginx-om.
#
# ZAVISNOST: uz automatsko pravljenje self-signed sertifikata potrebna
# je kolekcija community.crypto:
#
#   ansible-galaxy collection install community.crypto


# =====================================================================
# AKTIVACIJA
# =====================================================================

role_zabbix_web_enabled: false

# Zakovana verzija Zabbix paketa. Prazna vrednost instalira najnoviju.
#
# Ako je zakovana na hostu servera kroz role_zabbix_server_version,
# zakuj i ovde na istu vrednost.
#
role_zabbix_web_version: ""


# =====================================================================
# VEZA SA BAZOM
# =====================================================================
# Frontend cita bazu DIREKTNO. Ove vrednosti se moraju poklapati sa
# onima iz role zabbix_db.
#
role_zabbix_web_db_host: localhost
role_zabbix_web_db_port: 3306
role_zabbix_web_db_name: zabbix
role_zabbix_web_db_user: zabbix

# OBAVEZNO. Rola prekida rad ako vrednost nije popunjena.
#
# Ako rola zabbix_db ima ukljucen zaseban nalog za frontend
# (role_zabbix_db_frontend_enabled), ovde ide TAJ nalog i NJEGOVA
# lozinka — role_zabbix_db_frontend_user i
# role_zabbix_db_frontend_password. U suprotnom ide nalog servera.
#
#   host_vars/srv-web-01.yml
#     role_zabbix_web_db_user: "zabbix_web"
#     role_zabbix_web_db_password: "druga-lozinka"
#
role_zabbix_web_db_password: ""

# mysql — MySQL (podrazumevano)
# pgsql — PostgreSQL
#
# Odredjuje samo vrednost $DB['TYPE'] u zabbix.conf.php. Rola
# "zabbix_db" pokriva iskljucivo MySQL.
#
role_zabbix_web_db_backend: mysql


# =====================================================================
# VEZA SA ZABBIX SERVEROM
# =====================================================================
# Frontend se javlja serveru samo za neke radnje (izvrsavanje skripti,
# provera dostupnosti). Vecinu podataka cita iz baze.
#
role_zabbix_web_server_host: localhost
role_zabbix_web_server_port: 10051

# Ime koje se prikazuje u naslovu stranice i zaglavlju.
# Prazna vrednost koristi Zabbix podrazumevano.
#
#   role_zabbix_web_server_name: "Monitoring — Produkcija"
#
role_zabbix_web_server_name: ""


# =====================================================================
# MREZA
# =====================================================================
# Port za obican HTTP.
#
# Kada je HTTPS ukljucen a role_zabbix_web_http_redirect true, na
# ovom portu stoji samo preusmeravanje na HTTPS.
#
role_zabbix_web_listen_port: 8080

# Ime hosta pod kojim se frontend servira. Donja crta prihvata sve.
#
# Uz HTTPS ovo treba da bude STVARNO ime iz sertifikata — inace
# pretrazivac prijavljuje neslaganje imena. Ista vrednost se koristi
# i kao podrazumevani CN self-signed sertifikata.
#
#   role_zabbix_web_hostname: "zabbix.example.com"
#
role_zabbix_web_hostname: "_"

# Adresa na kojoj web server slusa. Prazna vrednost znaci sve adrese.
role_zabbix_web_listen_address: ""


# =====================================================================
# HTTPS
# =====================================================================
# Podrazumevano iskljuceno.
#
role_zabbix_web_https_enabled: false

role_zabbix_web_https_port: 8443

# Kada je true, na HTTP portu stoji vhost koji sve preusmerava na
# HTTPS (301). Postavi na false ako HTTP i HTTPS treba da rade
# uporedo, ili ako preusmeravanje radi reverse proxy ispred.
#
role_zabbix_web_http_redirect: true

# ---------------------------------------------------------------------
# Sertifikat i kljuc
# ---------------------------------------------------------------------
# Putanje na CILJNOM hostu. Fajlovi mogu doci na TRI nacina, redom
# kojim ih rola razmatra:
#
#   1. Sadrzaj zadat kroz role_zabbix_web_tls_cert_content i
#      _key_content — rola ih upisuje na putanje ispod. Ovo uvek ima
#      prednost i prepisuje postojece fajlove.
#
#   2. Fajlovi vec postoje na hostu — postavila ih je rola "root_ca",
#      doneti su rucno, ili ih je ova rola napravila ranije. Rola ih
#      tada samo koristi.
#
#   3. Fajlova nema — rola pravi PRIVREMEN self-signed sertifikat,
#      ako je role_zabbix_web_tls_selfsigned true.
#
# Sertifikat treba da bude PUN LANAC (fullchain): prvo sertifikat
# hosta, pa sertifikat izdavaoca. Sa samo listom sertifikatom
# pretrazivac prijavljuje nepoznatog izdavaoca.
#
role_zabbix_web_tls_cert: /etc/ssl/certs/zabbix-frontend-fullchain.pem
role_zabbix_web_tls_key: /etc/ssl/private/zabbix-frontend.key

# Sadrzaj u PEM formatu. Prazno znaci da se koriste fajlovi sa putanja
# iznad.
#
#   host_vars/srv-web-01.yml
#     role_zabbix_web_tls_cert_content: |
#       -----BEGIN CERTIFICATE-----
#       ...
#     role_zabbix_web_tls_key_content: |
#       -----BEGIN PRIVATE KEY-----
#       ...
#
# Privatni kljuc je TAJNA — drzi ga u host_vars, van git-a.
#
role_zabbix_web_tls_cert_content: ""
role_zabbix_web_tls_key_content: ""

# ---------------------------------------------------------------------
# Automatski self-signed sertifikat
# ---------------------------------------------------------------------
# Kada je true a NIJEDAN od dva fajla ne postoji, rola pravi privremen
# self-signed sertifikat da bi frontend uopste mogao da radi preko
# HTTPS-a.
#
# PAZNJA: pretrazivac ce prijavljivati gresku koju korisnik mora
# rucno preskociti. Ovo je polazna tacka, ne resenje. Kada dobijes
# pravi sertifikat, samo prekopiraj fajlove preko postojecih —
# rola ih NECE prepisati, jer pravi nove iskljucivo kada oba
# nedostaju.
#
# Postavi na false ako zelis da rola prekine rad umesto da improvizuje.
#
role_zabbix_web_tls_selfsigned: true

# Common Name sertifikata. Podrazumevano prati role_zabbix_web_hostname,
# a kada je on "_" pada na ime hosta iz inventory-ja.
#
# Rola sama dodaje SAN unos za CN — kao IP: ako je CN IPv4 adresa,
# inace kao DNS:. Klijenti od Chrome 58 naovamo ignorisu CN i gledaju
# iskljucivo SAN, pa sertifikat bez njega biva odbijen.
#
role_zabbix_web_tls_selfsigned_cn: >-
  {{ role_zabbix_web_hostname
     if role_zabbix_web_hostname != '_'
     else inventory_hostname }}

# Dodatni SAN unosi, u formatu "DNS:ime" ili "IP:adresa".
#
#   role_zabbix_web_tls_selfsigned_sans:
#     - "IP:10.0.0.60"
#     - "DNS:zabbix"
#
role_zabbix_web_tls_selfsigned_sans: []

# Organizacija u subject polju. Prazno se ne upisuje.
role_zabbix_web_tls_selfsigned_org: ""

# Vazenje u danima. 397 je gornja granica koju vecina klijenata
# prihvata bez prigovora.
role_zabbix_web_tls_selfsigned_days: 397

role_zabbix_web_tls_selfsigned_key_size: 2048

# Paketi potrebni modulima iz community.crypto na ciljnom hostu.
role_zabbix_web_tls_dependency_packages:
  - python3-cryptography

# ---------------------------------------------------------------------
# TLS parametri
# ---------------------------------------------------------------------
# Podrazumevano odgovara Mozilla "intermediate" preporuci: bez
# TLSv1.0 i TLSv1.1, samo AEAD sifre sa perfect forward secrecy.
#
# Spusti na "TLSv1.2" ako neki stariji klijent ne podnosi TLSv1.3.
#
role_zabbix_web_tls_protocols: "TLSv1.2 TLSv1.3"

role_zabbix_web_tls_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

# HTTP/2. Rola sama bira ispravnu sintaksu prema verziji Nginx-a:
# do 1.25.0 kroz "listen ... http2", od 1.25.1 kroz "http2 on".
#
role_zabbix_web_http2: true

# ---------------------------------------------------------------------
# HSTS
# ---------------------------------------------------------------------
# Zaglavlje kojim se pretrazivacu kaze da ubuduce ovaj host otvara
# ISKLJUCIVO preko HTTPS-a.
#
# PAZNJA: pretrazivac to pamti max_age sekundi i ne moze se povuci
# gasenjem opcije na serveru. Ako ti sertifikat istekne ili posluzis
# sajt preko HTTP-a, klijenti ce dobiti gresku bez mogucnosti da je
# preskoce.
#
# Uz self-signed sertifikat HSTS je posebno los izbor: greska
# sertifikata uz HSTS se u vecini pretrazivaca NE MOZE preskociti.
#
role_zabbix_web_hsts_enabled: false
role_zabbix_web_hsts_max_age: 31536000


# =====================================================================
# PHP
# =====================================================================
# Zabbix 7.0 zahteva PHP 8.0 ili noviji. Vrednosti ispod su
# minimalne koje Zabbix trazi — nize vrednosti frontend odbija.
#
role_zabbix_web_php_max_execution_time: 300
role_zabbix_web_php_memory_limit: 128M
role_zabbix_web_php_post_max_size: 16M
role_zabbix_web_php_upload_max_filesize: 2M
role_zabbix_web_php_max_input_time: 300

# Vremenska zona PHP-a. Utice na prikaz vremena u frontendu.
role_zabbix_web_php_timezone: Europe/Belgrade


# =====================================================================
# DODATNA KONFIGURACIJA
# =====================================================================
# Proizvoljne PHP linije koje se dodaju u zabbix.conf.php.
#
#   role_zabbix_web_extra_config: |
#     $DB['ENCRYPTION'] = true;
#     $DB['VERIFY_HOST'] = false;
#
role_zabbix_web_extra_config: ""

# Proizvoljne Nginx direktive unutar server bloka.
#
#   role_zabbix_web_nginx_extra_config: |
#     allow 10.0.0.0/8;
#     deny all;
#
role_zabbix_web_nginx_extra_config: ""


# =====================================================================
# SERVIS
# =====================================================================

role_zabbix_web_service_enabled: true
role_zabbix_web_service_state: started
