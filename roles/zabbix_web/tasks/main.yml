---
# roles/zabbix_web/tasks/main.yml
#
#   1. Provere
#   2. Instalacija paketa
#   3. PHP podesavanja
#   4. TLS materijal
#   5. Vhost konfiguracija
#   6. zabbix.conf.php — preskace carobnjak
#   7. Servisi

- name: "Instalacija i konfiguracija Zabbix frontenda"
  block:

    # -----------------------------------------------------------------
    # 1. Provere
    # -----------------------------------------------------------------

    - name: "Provera da je distribucija podrzana"
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          Rola "zabbix_web" trenutno podrzava iskljucivo Debian/Ubuntu,
          a ovaj host je {{ ansible_os_family | default('nepoznat') }}.
        success_msg: "Distribucija je podrzana."

    - name: "Provera da je lozinka baze zadata"
      ansible.builtin.assert:
        that:
          - role_zabbix_web_db_password is defined
          - role_zabbix_web_db_password | length > 0
        fail_msg: >-
          role_zabbix_web_db_password nije popunjen. Frontend cita
          bazu direktno i bez lozinke ne moze da radi. Vrednost mora
          odgovarati nalogu iz role zabbix_db — bilo nalogu servera,
          bilo zasebnom nalogu frontenda.
        success_msg: "Lozinka baze je zadata."

    # Isti port za HTTP i HTTPS znaci dva server bloka koja slusaju
    # na istoj adresi; Nginx tada ne startuje.
    - name: "Provera da se HTTP i HTTPS port razlikuju"
      ansible.builtin.assert:
        that:
          - role_zabbix_web_listen_port | int != role_zabbix_web_https_port | int
        fail_msg: >-
          role_zabbix_web_listen_port i role_zabbix_web_https_port su
          oba {{ role_zabbix_web_listen_port }}. Portovi se moraju
          razlikovati.
        success_msg: "Portovi se razlikuju."
      when: role_zabbix_web_https_enabled | bool

    # Sadrzaj sertifikata bez kljuca (ili obrnuto) daje polovicno
    # stanje: jedan fajl bi bio prepisan, drugi bi ostao stari i ne
    # bi mu odgovarao.
    - name: "Provera da su sertifikat i kljuc zadati zajedno"
      ansible.builtin.assert:
        that:
          - (role_zabbix_web_tls_cert_content | length > 0)
            == (role_zabbix_web_tls_key_content | length > 0)
        fail_msg: >-
          Zadat je sadrzaj samo jednog od dva TLS fajla. Popuni i
          role_zabbix_web_tls_cert_content i
          role_zabbix_web_tls_key_content, ili ostavi oba prazna pa
          koristi fajlove sa hosta.
        success_msg: "TLS sadrzaj je zadat konzistentno."
      when: role_zabbix_web_https_enabled | bool

    # Ime hosta iz sertifikata mora odgovarati imenu kroz koje se
    # frontend otvara. Sa "_" pretrazivac uvek prijavljuje neslaganje.
    - name: "Upozorenje kada je HTTPS ukljucen bez imena hosta"
      ansible.builtin.debug:
        msg: >-
          role_zabbix_web_hostname je "_", a HTTPS je ukljucen.
          Konfiguracija ce raditi, ali ce pretrazivac prijaviti
          neslaganje imena. Upisi stvarno ime iz sertifikata.
      when:
        - role_zabbix_web_https_enabled | bool
        - role_zabbix_web_hostname == '_'

    # -----------------------------------------------------------------
    # 2. Instalacija
    # -----------------------------------------------------------------

    - name: "Instalacija frontenda i Nginx konfiguracije"
      block:

        - name: "Instalacija paketa {{ _zabbix_web_frontend_package }} i {{ _zabbix_web_conf_package }}"
          ansible.builtin.apt:
            name: >-
              {{ [_zabbix_web_frontend_package, _zabbix_web_conf_package]
                 | map('regex_replace', '$',
                       '=' ~ role_zabbix_web_version
                       if role_zabbix_web_version | length > 0 else '')
                 | list }}
            state: present
            update_cache: true
            cache_valid_time: 3600
          notify:
            - "Restartuj web server"
            - "Restartuj PHP-FPM"

      rescue:

        - name: "Objasnjenje neuspele instalacije"
          ansible.builtin.fail:
            msg: >-
              Instalacija Zabbix frontenda nije uspela. Najcesci uzrok
              je da Zabbix repozitorijum nije dodat — host mora biti i
              u grupi [apply_repos], a apply_repos mora ici pre
              deploy_zabbix_web u playbook.yml. Proveri sa:
              apt-cache policy {{ _zabbix_web_frontend_package }}

    # -----------------------------------------------------------------
    # 3. PHP
    # -----------------------------------------------------------------
    # Verzija PHP-a se otkriva iz sistema, jer se razlikuje izmedju
    # Ubuntu izdanja (8.1 na 22.04, 8.3 na 24.04). Zakovana putanja
    # bi radila samo na jednom izdanju.

    - name: "Otkrivanje verzije PHP-a"
      ansible.builtin.shell:
        cmd: "php -r 'echo PHP_MAJOR_VERSION . \".\" . PHP_MINOR_VERSION;'"
      register: _php_version
      changed_when: false

    - name: "Podesavanja PHP-a za Zabbix"
      ansible.builtin.template:
        src: zabbix-php.ini.j2
        dest: "/etc/php/{{ _php_version.stdout }}/fpm/conf.d/99-zabbix.ini"
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: "Restartuj PHP-FPM"

    # -----------------------------------------------------------------
    # 4. TLS materijal
    # -----------------------------------------------------------------
    # Redosled je bitan i cini razliku izmedju role koja pomaze i role
    # koja prepisuje tudji rad:
    #
    #   a) sadrzaj zadat u varijablama  -> upisuje se, uvek
    #   b) fajlovi vec postoje          -> koriste se, ne diraju se
    #   c) fajlova nema                 -> pravi se self-signed
    #
    # Slucaj (c) se prepoznaje po tome da NIJEDAN od dva fajla ne
    # postoji. Cim jedan postoji, rola ne pravi nista — inace bi
    # rucno donet sertifikat bio prepisan pri sledecem pokretanju.

    - name: "Priprema TLS materijala"
      when: role_zabbix_web_https_enabled | bool
      block:

        # Bez "mode" namerno: /etc/ssl/private na Debianu ima uze
        # dozvole od podrazumevanih i ne sme se rasiriti.
        - name: "Folderi za TLS fajlove"
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
          loop:
            - "{{ role_zabbix_web_tls_cert | dirname }}"
            - "{{ role_zabbix_web_tls_key | dirname }}"
          loop_control:
            label: "{{ item }}"

        # --- (a) sadrzaj zadat u varijablama --------------------------

        - name: "Upis TLS sertifikata iz varijable"
          ansible.builtin.copy:
            content: "{{ role_zabbix_web_tls_cert_content }}"
            dest: "{{ role_zabbix_web_tls_cert }}"
            owner: root
            group: root
            mode: '0644'
            backup: true
          when: role_zabbix_web_tls_cert_content | length > 0
          notify: "Restartuj web server"

        # Privatni kljuc cita Nginx master proces, koji radi kao root.
        # Sire dozvole nisu potrebne ni pozeljne.
        - name: "Upis TLS privatnog kljuca iz varijable"
          ansible.builtin.copy:
            content: "{{ role_zabbix_web_tls_key_content }}"
            dest: "{{ role_zabbix_web_tls_key }}"
            owner: root
            group: root
            mode: '0600'
            backup: true
          no_log: true
          when: role_zabbix_web_tls_key_content | length > 0
          notify: "Restartuj web server"

        # --- Stanje na disku -----------------------------------------

        - name: "Provera postojeceg TLS materijala"
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ role_zabbix_web_tls_cert }}"
            - "{{ role_zabbix_web_tls_key }}"
          loop_control:
            label: "{{ item }}"
          register: _tls_stat

        - name: "Zapamceno stanje TLS fajlova"
          ansible.builtin.set_fact:
            _tls_cert_exists: "{{ _tls_stat.results[0].stat.exists }}"
            _tls_key_exists: "{{ _tls_stat.results[1].stat.exists }}"

        # Sertifikat bez kljuca nije upotrebljiv, a kljuc bez
        # sertifikata gotovo uvek znaci prekinut raniji pokusaj.
        # Automatsko pravljenje bi u tom slucaju prepisalo ono sto je
        # ostalo, pa se radije prekida rad.
        - name: "Provera da nedostaju oba fajla ili nijedan"
          ansible.builtin.assert:
            that:
              - (_tls_cert_exists | bool) == (_tls_key_exists | bool)
            fail_msg: >-
              Postoji samo jedan od dva TLS fajla:
              sertifikat {{ 'postoji' if _tls_cert_exists | bool else 'nedostaje' }}
              ({{ role_zabbix_web_tls_cert }}), kljuc
              {{ 'postoji' if _tls_key_exists | bool else 'nedostaje' }}
              ({{ role_zabbix_web_tls_key }}).
              Donesi oba, ili obrisi preostali pa pusti rolu da napravi
              privremen self-signed par.
            success_msg: "Stanje TLS fajlova je konzistentno."

        # --- (c) automatski self-signed ------------------------------

        - name: "Pravljenje privremenog self-signed sertifikata"
          when:
            - not (_tls_cert_exists | bool)
            - not (_tls_key_exists | bool)
            - role_zabbix_web_tls_selfsigned | bool
          block:

            - name: "Instalacija zavisnosti za rad sa sertifikatima"
              ansible.builtin.apt:
                name: "{{ role_zabbix_web_tls_dependency_packages }}"
                state: present
                update_cache: true
                cache_valid_time: 3600

            - name: "Privatni kljuc za self-signed sertifikat"
              community.crypto.openssl_privatekey:
                path: "{{ role_zabbix_web_tls_key }}"
                type: RSA
                size: "{{ role_zabbix_web_tls_selfsigned_key_size }}"
                regenerate: never
                owner: root
                group: root
                mode: '0600'
              no_log: true

            # SAN je obavezan: klijenti od Chrome 58 naovamo potpuno
            # ignorisu Common Name. Sertifikat bez SAN unosa za
            # sopstveni CN biva odbijen porukom koja ne upucuje na
            # uzrok.
            - name: "CSR za self-signed sertifikat"
              community.crypto.openssl_csr:
                path: "{{ _zabbix_web_tls_csr }}"
                privatekey_path: "{{ role_zabbix_web_tls_key }}"
                subject: "{{ _zabbix_web_tls_subject }}"
                subject_alt_name: "{{ _zabbix_web_tls_sans }}"
                use_common_name_for_san: false
                basic_constraints:
                  - 'CA:FALSE'
                basic_constraints_critical: true
                key_usage:
                  - digitalSignature
                  - keyEncipherment
                key_usage_critical: true
                extended_key_usage:
                  - serverAuth
                create_subject_key_identifier: true
                digest: sha256
                owner: root
                group: root
                mode: '0600'

            - name: "Self-signed sertifikat"
              community.crypto.x509_certificate:
                path: "{{ role_zabbix_web_tls_cert }}"
                csr_path: "{{ _zabbix_web_tls_csr }}"
                privatekey_path: "{{ role_zabbix_web_tls_key }}"
                provider: selfsigned
                selfsigned_not_after: "+{{ role_zabbix_web_tls_selfsigned_days }}d"
                selfsigned_digest: sha256
                owner: root
                group: root
                mode: '0644'
              notify: "Restartuj web server"

            - name: "Napomena o privremenom sertifikatu"
              ansible.builtin.debug:
                msg: >-
                  Napravljen je PRIVREMEN self-signed sertifikat za
                  "{{ role_zabbix_web_tls_selfsigned_cn }}", vazenja
                  {{ role_zabbix_web_tls_selfsigned_days }} dana. SAN:
                  {{ _zabbix_web_tls_sans | join(', ') }}.
                  Pretrazivac ce prijavljivati gresku. Kada dobijes
                  pravi sertifikat, prekopiraj ga preko
                  {{ role_zabbix_web_tls_cert }} i
                  {{ role_zabbix_web_tls_key }} — rola ih nece
                  prepisati, jer nove pravi samo kada oba nedostaju.

        # --- (b) fajlovi moraju odnekud doci -------------------------

        - name: "Potvrda da TLS materijal postoji"
          ansible.builtin.assert:
            that:
              - _tls_cert_exists | bool
              - _tls_key_exists | bool
            fail_msg: >-
              HTTPS je ukljucen, TLS fajlovi ne postoje, a automatsko
              pravljenje je iskljuceno (role_zabbix_web_tls_selfsigned
              je false). Ocekivano:
              {{ role_zabbix_web_tls_cert }} i {{ role_zabbix_web_tls_key }}.
              Donesi fajlove na host, zadaj njihov sadrzaj kroz
              role_zabbix_web_tls_cert_content i _key_content, ili
              ukljuci role_zabbix_web_tls_selfsigned.
            success_msg: "TLS materijal je na mestu."
          when: not (role_zabbix_web_tls_selfsigned | bool)

    # -----------------------------------------------------------------
    # 5. Vhost
    # -----------------------------------------------------------------
    # Paket zabbix-nginx-conf isporucuje vhost sa zakomentarisanim
    # listen i server_name — bez izmene ne radi. Rola upisuje
    # sopstvenu verziju u celosti.

    # Sintaksa za HTTP/2 se menjala: do 1.25.0 ide kao parametar
    # direktive listen, od 1.25.1 kao zasebna direktiva "http2 on".
    # Stara sintaksa na novom Nginx-u ispisuje upozorenje, nova na
    # starom prekida rad — zato se verzija otkriva.
    #
    # "nginx -v" pise na standardni izlaz za greske, otuda 2>&1.
    - name: "Otkrivanje verzije Nginx-a"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          nginx -v 2>&1 | sed -E 's#^nginx version: nginx/([0-9.]+).*#\1#'
        executable: /bin/bash
      register: _nginx_version
      changed_when: false

    - name: "Izbor sintakse za HTTP/2"
      ansible.builtin.set_fact:
        _zabbix_web_http2_new_syntax: >-
          {{ _nginx_version.stdout is version('1.25.1', '>=') }}

    - name: "Vhost konfiguracija"
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: "{{ _zabbix_web_vhost_file }}"
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: "Restartuj web server"

    # Provera cele Nginx konfiguracije pre restarta. Bez nje bi
    # greska u vhost-u oborila web server koji do tada radi.
    - name: "Provera Nginx konfiguracije"
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    # -----------------------------------------------------------------
    # 6. Konfiguracija frontenda
    # -----------------------------------------------------------------
    # Upis ovog fajla preskace carobnjak za instalaciju koji se inace
    # pojavljuje pri prvom otvaranju frontenda.

    - name: "Folder za konfiguraciju frontenda"
      ansible.builtin.file:
        path: /etc/zabbix/web
        state: directory
        owner: root
        group: www-data
        mode: '0750'

    - name: "Upis zabbix.conf.php"
      ansible.builtin.template:
        src: zabbix.conf.php.j2
        dest: "{{ _zabbix_web_config_file }}"
        owner: root
        group: www-data
        mode: '0640'
        backup: true
      no_log: true
      notify: "Restartuj PHP-FPM"

    # -----------------------------------------------------------------
    # 7. Servisi
    # -----------------------------------------------------------------

    - name: "Servis PHP-FPM"
      ansible.builtin.service:
        name: "php{{ _php_version.stdout }}-fpm"
        enabled: true
        state: started

    - name: "Servis {{ _zabbix_web_service }}"
      ansible.builtin.service:
        name: "{{ _zabbix_web_service }}"
        enabled: "{{ role_zabbix_web_service_enabled | bool }}"
        state: "{{ role_zabbix_web_service_state }}"

  when: role_zabbix_web_enabled | default(false) | bool
