---
# roles/zabbix_web/tasks/main.yml
#
#   1. Provere
#   2. Instalacija paketa
#   3. Otkrivanje okruzenja (PHP, putanja frontenda, Nginx)
#   4. TLS materijal
#   5. PHP-FPM pool
#   6. Vhost konfiguracija
#   7. Iskljucivanje vendorove i podrazumevane konfiguracije
#   8. Provera konfiguracije i zauzetosti portova
#   9. zabbix.conf.php — preskace carobnjak
#  10. Servisi
#
# NACELO: nijedan fajl koji dpkg prati ne sme biti izmenjen. Rola
# upisuje SOPSTVENE fajlove pod sopstvenim imenima, a vendorove samo
# iskljucuje iz upotrebe uklanjanjem veza koje je napravila postinst
# skripta paketa.

- name: "Instalacija i konfiguracija Zabbix frontenda"
  block:

    # -----------------------------------------------------------------
    # 1. Provere
    # -----------------------------------------------------------------

    - name: "Provera da je distribucija podrzana"
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          Rola "zabbix_web" trenutno podrzava iskljucivo Debian/Ubuntu,
          a ovaj host je {{ ansible_os_family | default('nepoznat') }}.
        success_msg: "Distribucija je podrzana."

    # Pogresna vrednost bi tiho pala na MySQL, i u zabbix.conf.php i u
    # izboru PHP ekstenzije. Bolje prekinuti odmah.
    - name: "Provera izbora backend-a"
      ansible.builtin.assert:
        that:
          - role_zabbix_web_db_backend in ['mysql', 'pgsql']
        fail_msg: >-
          role_zabbix_web_db_backend mora biti "mysql" ili "pgsql",
          a zadato je "{{ role_zabbix_web_db_backend }}".
        success_msg: "Backend baze je ispravno zadat."

    - name: "Provera da je lozinka baze zadata"
      ansible.builtin.assert:
        that:
          - role_zabbix_web_db_password is defined
          - role_zabbix_web_db_password | length > 0
        fail_msg: >-
          role_zabbix_web_db_password nije popunjen. Frontend cita
          bazu direktno i bez lozinke ne moze da radi. Vrednost mora
          odgovarati nalogu iz role zabbix_db — bilo nalogu servera,
          bilo zasebnom nalogu frontenda.
        success_msg: "Lozinka baze je zadata."

    # Isti port za HTTP i HTTPS znaci dva server bloka koja slusaju
    # na istoj adresi; Nginx tada ne startuje.
    - name: "Provera da se HTTP i HTTPS port razlikuju"
      ansible.builtin.assert:
        that:
          - role_zabbix_web_listen_port | int != role_zabbix_web_https_port | int
        fail_msg: >-
          role_zabbix_web_listen_port i role_zabbix_web_https_port su
          oba {{ role_zabbix_web_listen_port }}. Portovi se moraju
          razlikovati.
        success_msg: "Portovi se razlikuju."
      when: role_zabbix_web_https_enabled | bool

    # Ime hosta iz sertifikata mora odgovarati imenu kroz koje se
    # frontend otvara. Sa "_" pretrazivac uvek prijavljuje neslaganje.
    - name: "Upozorenje kada je HTTPS ukljucen bez imena hosta"
      ansible.builtin.debug:
        msg: >-
          role_zabbix_web_hostname je "_", a HTTPS je ukljucen.
          Konfiguracija ce raditi, ali ce pretrazivac prijaviti
          neslaganje imena. Upisi stvarno ime iz sertifikata.
      when:
        - role_zabbix_web_https_enabled | bool
        - role_zabbix_web_hostname == '_'

    # PHP odbija post_max_size manji od upload_max_filesize i pri tom
    # ne prijavlja gresku — samo tise odbacuje velike zahteve.
    - name: "Provera odnosa PHP velicina"
      ansible.builtin.assert:
        that:
          - (role_zabbix_web_php_post_max_size | human_to_bytes)
            >= (role_zabbix_web_php_upload_max_filesize | human_to_bytes)
        fail_msg: >-
          role_zabbix_web_php_post_max_size
          ({{ role_zabbix_web_php_post_max_size }}) je manji od
          role_zabbix_web_php_upload_max_filesize
          ({{ role_zabbix_web_php_upload_max_filesize }}). Upload nikad
          ne bi prosao, a PHP to ne prijavljuje kao gresku.
        success_msg: "Odnos PHP velicina je ispravan."

    # -----------------------------------------------------------------
    # 2. Instalacija
    # -----------------------------------------------------------------
    # zabbix-nginx-conf se instalira iako rola ne koristi njegove
    # fajlove. Razlog je namerno konzervativan: paket ostaje jedini
    # izvor "sveze" vendorove konfiguracije na disku, pa pri nadogradnji
    # Zabbix-a mozes uporediti nasu konfiguraciju sa onom koju Zabbix
    # trenutno preporucuje:
    #
    #   diff /etc/zabbix/nginx.conf /etc/nginx/conf.d/zabbix-ansible.conf

    - name: "Instalacija frontenda i vendorove konfiguracije"
      block:

        - name: "Instalacija paketa {{ _zabbix_web_frontend_package }} i {{ _zabbix_web_conf_package }}"
          ansible.builtin.apt:
            name: >-
              {{ [_zabbix_web_frontend_package, _zabbix_web_conf_package]
                 | map('regex_replace', '$',
                       '=' ~ role_zabbix_web_version
                       if role_zabbix_web_version | length > 0 else '')
                 | list }}
            state: present
            update_cache: true
            cache_valid_time: 3600
          notify:
            - "Restartuj web server"
            - "Restartuj PHP-FPM"

      rescue:

        - name: "Objasnjenje neuspele instalacije"
          ansible.builtin.fail:
            msg: >-
              Instalacija Zabbix frontenda nije uspela. Najcesci uzrok
              je da Zabbix repozitorijum nije dodat — host mora biti i
              u grupi [apply_repos], a apply_repos mora ici pre
              deploy_zabbix_web u playbook.yml. Proveri sa:
              apt-cache policy {{ _zabbix_web_frontend_package }}

    # -----------------------------------------------------------------
    # 3. Otkrivanje okruzenja
    # -----------------------------------------------------------------
    # Verzija PHP-a se cita iz rasporeda foldera u /etc/php, a NE
    # kroz "php -r". Razlog: "php" je CLI SAPI, koji ne mora biti
    # instaliran, a na hostu sa vise PHP verzija pokazuje na onu koju
    # bira update-alternatives — sto ne mora biti ona cija FPM
    # instanca servisira Zabbix.

    - name: "Otkrivanje PHP-FPM foldera"
      ansible.builtin.find:
        paths: /etc/php
        patterns: fpm
        file_type: directory
        recurse: true
        depth: 2
      register: _php_fpm_dirs

    - name: "Provera da je PHP-FPM instaliran"
      ansible.builtin.assert:
        that:
          - _php_fpm_dirs.files | length > 0
        fail_msg: >-
          Ni u jednom podfolderu /etc/php nema "fpm" foldera, dakle
          PHP-FPM nije instaliran. Paket
          {{ _zabbix_web_frontend_package }} ga inace povlaci —
          proveri da li je instalacija zaista prosla.
        success_msg: "PHP-FPM je instaliran."

    # Sa vise instaliranih verzija uzima se najveca. Poredjenje je
    # tekstualno, sto bi pogresilo tek na "8.10" naspram "8.9" —
    # kombinacija koja u Debian paketima ne postoji.
    - name: "Izbor verzije PHP-a"
      ansible.builtin.set_fact:
        _zabbix_web_php_version: >-
          {{ _php_fpm_dirs.files
             | map(attribute='path') | map('dirname') | map('basename')
             | sort | last }}

    - name: "Otkrivena verzija PHP-a"
      ansible.builtin.debug:
        msg: "PHP-FPM verzija: {{ _zabbix_web_php_version }}"

    # Tek sada, jer se ime paketa izvodi iz otkrivene verzije PHP-a.
    #
    # Paket zabbix-frontend-php ima ALTERNATIVNU zavisnost na PHP
    # ekstenziju za bazu, pa apt bira jednu — u praksi MySQL. Sa
    # role_zabbix_web_db_backend: pgsql frontend bi ostao bez pgsql
    # ekstenzije i prijavio gresku koja ne upucuje na uzrok.
    - name: "PHP ekstenzija za {{ role_zabbix_web_db_backend }}"
      ansible.builtin.apt:
        name: "{{ _zabbix_web_db_php_package }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      notify: "Restartuj PHP-FPM"

    # Od zvanicnih paketa 7.2 PHP fajlovi frontenda su premesteni iz
    # /usr/share/zabbix u /usr/share/zabbix/ui. Zakovana putanja bi na
    # 7.2+ dala stranicu sa uputstvom umesto ekrana za prijavu.
    - name: "Provera nove putanje frontenda"
      ansible.builtin.stat:
        path: /usr/share/zabbix/ui
      register: _zabbix_web_ui_dir

    - name: "Izbor putanje frontenda"
      ansible.builtin.set_fact:
        _zabbix_web_docroot: >-
          {{ '/usr/share/zabbix/ui'
             if _zabbix_web_ui_dir.stat.isdir | default(false)
             else '/usr/share/zabbix' }}

    - name: "Otkrivena putanja frontenda"
      ansible.builtin.debug:
        msg: "Frontend se servira iz: {{ _zabbix_web_docroot }}"

    # Sintaksa za HTTP/2 se menjala: do 1.25.0 ide kao parametar
    # direktive listen, od 1.25.1 kao zasebna direktiva "http2 on".
    # Stara sintaksa na novom Nginx-u ispisuje upozorenje, nova na
    # starom prekida rad — zato se verzija otkriva.
    #
    # "nginx -v" pise na standardni izlaz za greske, otuda 2>&1.
    - name: "Otkrivanje verzije Nginx-a"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          nginx -v 2>&1 | sed -E 's#^nginx version: nginx/([0-9.]+).*#\1#'
        executable: /bin/bash
      register: _nginx_version
      changed_when: false

    - name: "Izbor sintakse za HTTP/2"
      ansible.builtin.set_fact:
        _zabbix_web_http2_new_syntax: >-
          {{ _nginx_version.stdout is version('1.25.1', '>=') }}

    # -----------------------------------------------------------------
    # 4. TLS materijal
    # -----------------------------------------------------------------
    # Rola NE unosi sertifikat i kljuc kroz varijable. TLS materijal
    # se donosi na host van Ansible-a (rucno, kroz ACME klijenta,
    # kroz rolu root_ca...), a ova rola ga samo koristi.
    #
    # Ostaju dva slucaja:
    #
    #   a) fajlovi vec postoje  -> koriste se, ne diraju se
    #   b) fajlova nema         -> pravi se privremen self-signed par
    #
    # Slucaj (b) se prepoznaje po tome da NIJEDAN od dva fajla ne
    # postoji. Cim jedan postoji, rola ne pravi nista — inace bi
    # rucno donet sertifikat bio prepisan pri sledecem pokretanju.

    - name: "Priprema TLS materijala"
      when: role_zabbix_web_https_enabled | bool
      block:

        # Bez "mode" namerno: /etc/ssl/private na Debianu ima uze
        # dozvole od podrazumevanih i ne sme se rasiriti.
        - name: "Folderi za TLS fajlove"
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
          loop:
            - "{{ role_zabbix_web_tls_cert | dirname }}"
            - "{{ role_zabbix_web_tls_key | dirname }}"
          loop_control:
            label: "{{ item }}"

        # --- Stanje na disku -----------------------------------------

        - name: "Provera postojeceg TLS materijala"
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ role_zabbix_web_tls_cert }}"
            - "{{ role_zabbix_web_tls_key }}"
          loop_control:
            label: "{{ item }}"
          register: _tls_stat

        - name: "Zapamceno stanje TLS fajlova"
          ansible.builtin.set_fact:
            _tls_cert_exists: "{{ _tls_stat.results[0].stat.exists }}"
            _tls_key_exists: "{{ _tls_stat.results[1].stat.exists }}"

        # Sertifikat bez kljuca nije upotrebljiv, a kljuc bez
        # sertifikata gotovo uvek znaci prekinut raniji pokusaj.
        # Automatsko pravljenje bi u tom slucaju prepisalo ono sto je
        # ostalo, pa se radije prekida rad.
        - name: "Provera da nedostaju oba fajla ili nijedan"
          ansible.builtin.assert:
            that:
              - (_tls_cert_exists | bool) == (_tls_key_exists | bool)
            fail_msg: >-
              Postoji samo jedan od dva TLS fajla:
              sertifikat {{ 'postoji' if _tls_cert_exists | bool else 'nedostaje' }}
              ({{ role_zabbix_web_tls_cert }}), kljuc
              {{ 'postoji' if _tls_key_exists | bool else 'nedostaje' }}
              ({{ role_zabbix_web_tls_key }}).
              Donesi oba, ili obrisi preostali pa pusti rolu da napravi
              privremen self-signed par.
            success_msg: "Stanje TLS fajlova je konzistentno."

        # --- (b) automatski self-signed ------------------------------

        - name: "Pravljenje privremenog self-signed sertifikata"
          when:
            - not (_tls_cert_exists | bool)
            - not (_tls_key_exists | bool)
            - role_zabbix_web_tls_selfsigned | bool
          block:

            - name: "Instalacija zavisnosti za rad sa sertifikatima"
              ansible.builtin.apt:
                name: "{{ role_zabbix_web_tls_dependency_packages }}"
                state: present
                update_cache: true
                cache_valid_time: 3600

            - name: "Privatni kljuc za self-signed sertifikat"
              community.crypto.openssl_privatekey:
                path: "{{ role_zabbix_web_tls_key }}"
                type: RSA
                size: "{{ role_zabbix_web_tls_selfsigned_key_size }}"
                regenerate: never
                owner: root
                group: root
                mode: '0600'
              no_log: true

            # SAN je obavezan: klijenti od Chrome 58 naovamo potpuno
            # ignorisu Common Name. Sertifikat bez SAN unosa za
            # sopstveni CN biva odbijen porukom koja ne upucuje na
            # uzrok.
            - name: "CSR za self-signed sertifikat"
              community.crypto.openssl_csr:
                path: "{{ _zabbix_web_tls_csr }}"
                privatekey_path: "{{ role_zabbix_web_tls_key }}"
                subject: "{{ _zabbix_web_tls_subject }}"
                subject_alt_name: "{{ _zabbix_web_tls_sans }}"
                use_common_name_for_san: false
                basic_constraints:
                  - 'CA:FALSE'
                basic_constraints_critical: true
                key_usage:
                  - digitalSignature
                  - keyEncipherment
                key_usage_critical: true
                extended_key_usage:
                  - serverAuth
                create_subject_key_identifier: true
                digest: sha256
                owner: root
                group: root
                mode: '0600'

            - name: "Self-signed sertifikat"
              community.crypto.x509_certificate:
                path: "{{ role_zabbix_web_tls_cert }}"
                csr_path: "{{ _zabbix_web_tls_csr }}"
                privatekey_path: "{{ role_zabbix_web_tls_key }}"
                provider: selfsigned
                selfsigned_not_after: "+{{ role_zabbix_web_tls_selfsigned_days }}d"
                selfsigned_digest: sha256
                owner: root
                group: root
                mode: '0644'
              notify: "Restartuj web server"

            - name: "Napomena o privremenom sertifikatu"
              ansible.builtin.debug:
                msg: >-
                  Napravljen je PRIVREMEN self-signed sertifikat za
                  "{{ role_zabbix_web_tls_selfsigned_cn }}", vazenja
                  {{ role_zabbix_web_tls_selfsigned_days }} dana. SAN:
                  {{ _zabbix_web_tls_sans | join(', ') }}.
                  Pretrazivac ce prijavljivati gresku. Kada dobijes
                  pravi sertifikat, prekopiraj ga preko
                  {{ role_zabbix_web_tls_cert }} i
                  {{ role_zabbix_web_tls_key }} — rola ih nece
                  prepisati, jer nove pravi samo kada oba nedostaju.

        # --- (a) fajlovi moraju odnekud doci -------------------------

        - name: "Potvrda da TLS materijal postoji"
          ansible.builtin.assert:
            that:
              - _tls_cert_exists | bool
              - _tls_key_exists | bool
            fail_msg: >-
              HTTPS je ukljucen, TLS fajlovi ne postoje, a automatsko
              pravljenje je iskljuceno (role_zabbix_web_tls_selfsigned
              je false). Ocekivano:
              {{ role_zabbix_web_tls_cert }} i {{ role_zabbix_web_tls_key }}.
              Donesi fajlove na host, ili ukljuci
              role_zabbix_web_tls_selfsigned pa ce rola napraviti
              privremen self-signed par.
            success_msg: "TLS materijal je na mestu."
          when: not (role_zabbix_web_tls_selfsigned | bool)

    # -----------------------------------------------------------------
    # 5. PHP-FPM pool
    # -----------------------------------------------------------------
    # Rola drzi sopstveni pool jer se PHP podesavanja drugacije NE
    # MOGU postaviti. Direktive php_value[] iz pool-a imaju prednost
    # nad php.ini i nad svime iz conf.d — vendorov pool zakiva
    # max_execution_time, memory_limit, post_max_size,
    # upload_max_filesize, max_input_time i max_input_vars, pa je
    # svaka vrednost upisana u conf.d bila mrtvo slovo.

    - name: "Sopstveni PHP-FPM pool"
      ansible.builtin.template:
        src: php-fpm.conf.j2
        dest: "{{ _zabbix_web_pool_file }}"
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: "Restartuj PHP-FPM"

    # Fajl iz ranije verzije role. Nikad nije imao efekta, ali ostavljen
    # zavarava pri citanju konfiguracije.
    - name: "Uklanjanje neupotrebljivog PHP ini fajla iz ranije verzije role"
      ansible.builtin.file:
        path: "{{ _zabbix_web_legacy_ini }}"
        state: absent
      notify: "Restartuj PHP-FPM"

    # -----------------------------------------------------------------
    # 6. Vhost
    # -----------------------------------------------------------------

    - name: "Vhost konfiguracija"
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: "{{ _zabbix_web_vhost_file }}"
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: "Restartuj web server"

    # -----------------------------------------------------------------
    # 7. Iskljucivanje vendorove i podrazumevane konfiguracije
    # -----------------------------------------------------------------
    # Tek POSLE upisa nasih fajlova, da izmedju dva stanja ne postoji
    # trenutak bez ijedne vazece konfiguracije.
    #
    # Uklanjaju se ISKLJUCIVO simbolicne veze koje su napravile postinst
    # skripte. Fajlovi na koje pokazuju — /etc/zabbix/nginx.conf,
    # /etc/zabbix/php-fpm.conf i /etc/nginx/sites-available/default —
    # ostaju netaknuti.
    #
    # PAZNJA NA IMENA: Zabbix koristi razlicita imena na dve strane.
    # Nginx strana je "zabbix.conf", PHP strana "zabbix-php-fpm.conf".
    #
    # Nadogradnja paketa moze ponovo napraviti ove veze. Rola ih pri
    # sledecem pokretanju ponovo uklanja; do tada frontend radi, samo
    # uz suvisan vendorov pool i moguc sukob oko podrazumevanog
    # server bloka na portu 80.

    - name: "Iskljucivanje vendorovog vhost-a"
      ansible.builtin.file:
        path: "{{ _zabbix_web_vendor_vhost_link }}"
        state: absent
      notify: "Restartuj web server"

    - name: "Iskljucivanje vendorovog PHP-FPM pool-a"
      ansible.builtin.file:
        path: "{{ _zabbix_web_vendor_pool_link }}"
        state: absent
      notify: "Restartuj PHP-FPM"

    # Podrazumevani Nginx sajt slusa na "80 default_server". Ako neko
    # drugi vec drzi port 80, Nginx zbog njega uopste ne startuje —
    # a poruka o gresci ovaj fajl ne pominje.
    - name: "Uklanjanje podrazumevanog Nginx sajta"
      ansible.builtin.file:
        path: "{{ _zabbix_web_nginx_default_site }}"
        state: absent
      when: role_zabbix_web_disable_default_site | bool
      notify: "Restartuj web server"

    # Ranija verzija role je prepisivala /etc/zabbix/nginx.conf. Na
    # hostovima koji su kroz nju prosli taj conffile i dalje nosi njen
    # sadrzaj. Sada je van upotrebe, pa ne smeta, ali vredi znati.
    - name: "Provera da li je vendorov vhost ranije izmenjen"
      ansible.builtin.command:
        cmd: "dpkg --verify {{ _zabbix_web_conf_package }}"
      register: _dpkg_verify
      changed_when: false
      failed_when: false

    - name: "Napomena o izmenjenom vendorovom fajlu"
      ansible.builtin.debug:
        msg: >-
          Vendorov conffile je izmenjen — gotovo sigurno ga je
          prepisala ranija verzija ove role. Sada je van upotrebe i ne
          utice ni na sta. Ako zelis cist original:
          apt-get install --reinstall -o Dpkg::Options::="--force-confask"
          {{ _zabbix_web_conf_package }}
      when: _dpkg_verify.stdout | length > 0

    # -----------------------------------------------------------------
    # 8. Provera konfiguracije i zauzetosti portova
    # -----------------------------------------------------------------
    # Obe provere konfiguracije idu pre restarta. Bez njih bi greska u
    # nasem fajlu oborila servis koji do tada radi.
    #
    # Provera se ne moze uraditi kroz "validate" parametar modula
    # template, jer i Nginx i PHP-FPM proveravaju CELU konfiguraciju —
    # pojedinacan fajl van svog konteksta nije vazeca celina.

    - name: "Provera Nginx konfiguracije"
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: "Provera PHP-FPM konfiguracije"
      ansible.builtin.command:
        cmd: "{{ _zabbix_web_php_fpm_binary }} -t"
      changed_when: false

    # "nginx -t" proverava SINTAKSU, ne i da li su portovi slobodni.
    # Bez ove provere rola pada tek na pokretanju servisa, sa porukom
    # "Address already in use" koja ne kaze ko drzi port.
    #
    # Najcesci krivac je Apache: php paketi ga na nekim hostovima
    # dovuku kao zavisnost, a on onda drzi port 80.
    #
    # Racunaju se samo portovi koje ovaj vhost stvarno otvara: HTTPS
    # port kada je TLS ukljucen, HTTP port kada TLS nije ukljucen ili
    # kada na njemu stoji preusmeravanje.
    - name: "Portovi koje ovaj vhost otvara"
      ansible.builtin.set_fact:
        _zabbix_web_ports: >-
          {{ ([role_zabbix_web_https_port | int]
               if role_zabbix_web_https_enabled | bool else [])
             + ([role_zabbix_web_listen_port | int]
                if (not (role_zabbix_web_https_enabled | bool))
                   or (role_zabbix_web_http_redirect | bool) else []) }}

    - name: "Ko trenutno slusa na hostu"
      ansible.builtin.command:
        cmd: ss -lntpH
      register: _zabbix_web_listeners
      changed_when: false

    # Iz spiska se izbacuje sam Nginx — kada rola radi drugi put,
    # portove ocekivano drzi upravo on.
    - name: "Izdvajanje tudjih slusalaca na ciljnim portovima"
      ansible.builtin.set_fact:
        _zabbix_web_port_conflicts: >-
          {{ _zabbix_web_listeners.stdout_lines
             | select('search', ':(' ~ (_zabbix_web_ports | join('|')) ~ ') ')
             | reject('search', '"nginx"')
             | list }}

    - name: "Provera da ciljne portove ne drzi neki drugi program"
      ansible.builtin.assert:
        that:
          - _zabbix_web_port_conflicts | length == 0
        fail_msg: >-
          Port(ove) {{ _zabbix_web_ports | join(', ') }} vec drzi neko
          drugi, pa Nginx ne bi startovao. Poruka koju bi systemd
          prijavio ("Address already in use") ne kaze ko je krivac, pa
          je ovde ceo red iz "ss -lntp":
          {{ _zabbix_web_port_conflicts | join(' | ') }}.
          Ugasi taj program, ili promeni
          role_zabbix_web_listen_port / role_zabbix_web_https_port.
        success_msg: "Ciljni portovi su slobodni ili ih vec drzi Nginx."

    # -----------------------------------------------------------------
    # 9. Konfiguracija frontenda
    # -----------------------------------------------------------------
    # Ovaj fajl NIJE conffile — ne isporucuje ga nijedan paket, nego ga
    # inace pravi carobnjak pri prvom otvaranju frontenda. Time sto ga
    # rola upisuje, carobnjak se preskace.
    #
    # Folder /etc/zabbix/web isporucuje paket zabbix-frontend-php, pa
    # ovaj task obicno samo podesava vlasnistvo i dozvole. Direktorijum
    # nije conffile, tako da to ne dira nista sto dpkg proverava.

    - name: "Folder za konfiguraciju frontenda"
      ansible.builtin.file:
        path: /etc/zabbix/web
        state: directory
        owner: root
        group: www-data
        mode: '0750'

    - name: "Upis zabbix.conf.php"
      ansible.builtin.template:
        src: zabbix.conf.php.j2
        dest: "{{ _zabbix_web_config_file }}"
        owner: root
        group: www-data
        mode: '0640'
        backup: true
      no_log: true
      notify: "Restartuj PHP-FPM"

    # -----------------------------------------------------------------
    # 10. Servisi
    # -----------------------------------------------------------------

    - name: "Servis {{ _zabbix_web_php_service }}"
      ansible.builtin.service:
        name: "{{ _zabbix_web_php_service }}"
        enabled: true
        state: started

    - name: "Servis {{ _zabbix_web_service }}"
      ansible.builtin.service:
        name: "{{ _zabbix_web_service }}"
        enabled: "{{ role_zabbix_web_service_enabled | bool }}"
        state: "{{ role_zabbix_web_service_state }}"

  when: role_zabbix_web_enabled | default(false) | bool
