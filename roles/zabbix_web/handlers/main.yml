---
# roles/zabbix_web/handlers/main.yml

- name: "Restartuj web server"
  ansible.builtin.service:
    name: "{{ _zabbix_web_service }}"
    state: restarted
  when: role_zabbix_web_service_state != 'stopped'

# Ime servisa zavisi od verzije PHP-a, koja se otkriva u toku role.
# Uslov ispod sprecava pad handlera kada rola pukne pre tog taska.
- name: "Restartuj PHP-FPM"
  ansible.builtin.service:
    name: "{{ _zabbix_web_php_service }}"
    state: restarted
  when: _zabbix_web_php_version is defined
