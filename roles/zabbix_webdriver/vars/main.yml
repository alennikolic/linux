---
# roles/zabbix_webdriver/vars/main.yml

# ============================================================================
# Izvedene vrednosti. NE menjaj ih u group_vars ili host_vars - racunaju se iz
# varijabli u defaults/main.yml.
# ============================================================================

# Ime systemd servisa prati ime kontejnera, da bi "systemctl status" i
# "docker ps" pokazivali isti pojam.
_zabbix_webdriver_service: "{{ role_zabbix_webdriver_container_name }}"

_zabbix_webdriver_unit_path: "/etc/systemd/system/{{ _zabbix_webdriver_service }}.service"

# Pun naziv slike sa oznakom.
_zabbix_webdriver_image_ref: >-
  {{ role_zabbix_webdriver_image }}:{{ role_zabbix_webdriver_image_tag }}

# Krajnja tacka za proveru spremnosti. Selenium na /status vraca JSON u kojem
# polje value.ready govori da li prihvata nove sesije.
_zabbix_webdriver_status_url: >-
  http://{{ role_zabbix_webdriver_bind_address }}:{{ role_zabbix_webdriver_port }}/status

# Podrazumevani skup promenljivih okruzenja.
#
# SE_NODE_OVERRIDE_MAX_SESSIONS je ovde kljucan i cesto previdjen: bez njega
# Selenium ogranicava broj sesija na broj CPU jezgara, bez obzira na to sta
# pise u SE_NODE_MAX_SESSIONS, i to bez ijedne poruke u logu. Sa deset
# pollera na cetvorojezgarnom hostu to znaci sest zahteva u vecitom redu.
_zabbix_webdriver_env_base:
  SE_NODE_MAX_SESSIONS: "{{ role_zabbix_webdriver_max_sessions }}"
  SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
  SE_NODE_SESSION_TIMEOUT: "{{ role_zabbix_webdriver_session_timeout }}"
  SE_SESSION_REQUEST_TIMEOUT: "{{ role_zabbix_webdriver_session_request_timeout }}"
  SE_SESSION_RETRY_INTERVAL: "{{ role_zabbix_webdriver_session_retry_interval }}"
  SE_SCREEN_WIDTH: "{{ role_zabbix_webdriver_screen_width }}"
  SE_SCREEN_HEIGHT: "{{ role_zabbix_webdriver_screen_height }}"
  # VNC i noVNC sluze za rucno gledanje sesije u browseru. Zabbix ih ne
  # koristi, a otvaraju jos jedan port i jos jedan proces - zato ugaseni.
  SE_START_VNC: "false"
  SE_START_NO_VNC: "false"
  # Distributed tracing salje telemetriju; bez Jaeger backend-a samo pravi
  # buku u logu.
  SE_ENABLE_TRACING: "false"

# Konacan skup promenljivih. Korisnicke vrednosti nadjacavaju podrazumevane.
_zabbix_webdriver_env: >-
  {{ _zabbix_webdriver_env_base
     | combine(role_zabbix_webdriver_extra_env | default({}, true)) }}
