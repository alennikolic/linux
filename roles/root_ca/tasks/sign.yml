---
# roles/root_ca/tasks/sign.yml
#
# Potpisivanje jednog spoljnog CSR-a. Poziva se iz tasks/main.yml
# petljom nad role_root_ca_signed_csrs; tekuci unos je u varijabli
# "req".
#
# Razlika u odnosu na issue.yml: ovde CA ne pravi privatni kljuc.
# Kljuc je nastao na hostu kojem pripada i tamo ostaje — CA vidi samo
# zahtev i vraca potpis. To je bolji model svuda gde je izvodljiv.
#
# Tok:
#   1. Izvedena imena i putanje
#   2. Uklanjanje (state: absent)
#   3. Dopremanje CSR-a na CA host
#   4. Citanje CSR-a i provere
#   5. Odluka o obnovi
#   6. Potpisivanje
#   7. fullchain i preuzimanje

# ---------------------------------------------------------------------
# 1. Imena i putanje
# ---------------------------------------------------------------------

- name: "Izvedena imena za {{ req.filename }}"
  ansible.builtin.set_fact:
    _rs_name: "{{ req.filename }}"
    _rs_state: "{{ req.state | default('present') }}"
    _rs_days: "{{ req.days | default(role_root_ca_signed_days) }}"

- name: "Izvedene putanje za {{ _rs_name }}"
  ansible.builtin.set_fact:
    _rs_csr: "{{ _root_ca_csr_dir }}/{{ _rs_name }}.csr"
    _rs_crt: "{{ _root_ca_certs_dir }}/{{ _rs_name }}.crt"
    _rs_chain: "{{ _root_ca_certs_dir }}/{{ _rs_name }}-fullchain.crt"

# ---------------------------------------------------------------------
# 2. Uklanjanje
# ---------------------------------------------------------------------
# Rola ne vodi CRL — sertifikat ostaje tehnicki validan do isteka kod
# svakoga ko ga vec ima. Brisu se samo fajlovi na CA hostu.

- name: "Uklanjanje potpisanog sertifikata {{ _rs_name }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ _rs_csr }}"
    - "{{ _rs_crt }}"
    - "{{ _rs_chain }}"
  loop_control:
    label: "{{ item | basename }}"
  when: _rs_state == 'absent'

# ---------------------------------------------------------------------
# 3-7. Potpisivanje
# ---------------------------------------------------------------------

- name: "Potpisivanje CSR-a {{ _rs_name }}"
  when: _rs_state == 'present'
  block:

    - name: "Provera da je naveden tacno jedan izvor CSR-a"
      ansible.builtin.assert:
        that:
          - (req.src is defined) != (req.remote_src is defined)
        fail_msg: >-
          Unos '{{ _rs_name }}' mora imati tacno jedno od polja src
          (putanja na kontrolnom cvoru) ili remote_src (putanja na CA
          hostu). Zadato: src
          {{ 'da' if req.src is defined else 'ne' }}, remote_src
          {{ 'da' if req.remote_src is defined else 'ne' }}.
        success_msg: "Izvor CSR-a jednoznacan."

    - name: "Dopremanje CSR-a {{ _rs_name }} sa kontrolnog cvora"
      ansible.builtin.copy:
        src: "{{ req.src }}"
        dest: "{{ _rs_csr }}"
        owner: root
        group: root
        mode: '0644'
      when: req.src is defined

    - name: "Dopremanje CSR-a {{ _rs_name }} sa CA hosta"
      ansible.builtin.copy:
        src: "{{ req.remote_src }}"
        dest: "{{ _rs_csr }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: req.remote_src is defined

    # -----------------------------------------------------------------
    # 4. Sadrzaj CSR-a
    # -----------------------------------------------------------------
    # Ekstenzije potpisanog sertifikata dolaze iz zahteva. Rola ih ne
    # moze dopuniti — moze samo da prijavi ono sto nedostaje.

    - name: "Citanje CSR-a {{ _rs_name }}"
      community.crypto.openssl_csr_info:
        path: "{{ _rs_csr }}"
      register: _rs_info

    # Klijenti od Chrome 58 i ekvivalentnih verzija ostalih
    # pregledaca potpuno ignorisu Common Name i gledaju iskljucivo
    # SAN. Sertifikat bez SAN unosa bio bi neupotrebljiv, a greska
    # ("common name invalid") ne upucuje na uzrok — pa se odbija ovde.
    - name: "Provera da CSR {{ _rs_name }} sadrzi SAN"
      ansible.builtin.assert:
        that:
          - _rs_info.subject_alt_name | default([]) | length > 0
        fail_msg: >-
          CSR '{{ _rs_name }}' nema subjectAltName. Sertifikat bez
          SAN-a savremeni klijenti odbijaju bez obzira na Common Name.
          Ponovi zahtev na strani servera sa:
          -addext "subjectAltName=DNS:ime.example.com"
        success_msg: >-
          SAN: {{ _rs_info.subject_alt_name | default([]) | join(', ') }}

    - name: "UPOZORENJE: CSR {{ _rs_name }} nema extendedKeyUsage"
      ansible.builtin.debug:
        msg: >-
          CSR '{{ _rs_name }}' nema extendedKeyUsage, pa ga nece
          imati ni potpisan sertifikat. Vecina TLS servera radi i
          bez toga, ali pokoji klijent i pokoja Java biblioteka
          takav sertifikat odbijaju. Preporuceno je da zahtev
          sadrzi: -addext "extendedKeyUsage=serverAuth"
      when: _rs_info.extended_key_usage | default([]) | length == 0

    - name: "Podaci o zahtevu {{ _rs_name }}"
      ansible.builtin.debug:
        msg: >-
          CN: {{ _rs_info.subject.commonName | default('bez CN') }},
          SAN: {{ _rs_info.subject_alt_name | default([]) | join(', ') }},
          vazice {{ _rs_days }} dana.

    # -----------------------------------------------------------------
    # 5. Odluka o obnovi
    # -----------------------------------------------------------------
    # x509_certificate poredi sertifikat sa CSR-om, ali ne i datum
    # isteka. Sertifikat koji istice, a CSR se nije menjao, modul bi
    # ostavio na miru — pa se obnova trazi izricito.

    - name: "Provera da li potpisan sertifikat {{ _rs_name }} postoji"
      ansible.builtin.stat:
        path: "{{ _rs_crt }}"
      register: _rs_crt_stat
      changed_when: false

    - name: "Citanje postojeceg sertifikata {{ _rs_name }}"
      community.crypto.x509_certificate_info:
        path: "{{ _rs_crt }}"
        valid_at:
          obnova: "+{{ role_root_ca_renew_before_days }}d"
      register: _rs_existing
      when:
        - _rs_crt_stat.stat.exists
        - role_root_ca_renew_before_days | int > 0

    - name: "Odluka o obnovi za {{ _rs_name }}"
      ansible.builtin.set_fact:
        _rs_renew: >-
          {{ _rs_crt_stat.stat.exists
             and role_root_ca_renew_before_days | int > 0
             and not (_rs_existing.valid_at.obnova | default(true)) }}

    - name: "Obnova sertifikata {{ _rs_name }}"
      ansible.builtin.debug:
        msg: >-
          Sertifikat '{{ _rs_name }}' istice
          {{ _rs_existing.not_after }}, sto je unutar narednih
          {{ role_root_ca_renew_before_days }} dana — bice ponovo
          potpisan istim zahtevom. Privatni kljuc na ciljnom hostu
          ostaje nepromenjen; dovoljno je preneti nov .crt.
      when: _rs_renew | bool

    # -----------------------------------------------------------------
    # 6. Potpisivanje
    # -----------------------------------------------------------------
    # not_before je pomeren dan unazad zbog razmimoilazenja satova.
    # Sertifikat koji "jos ne vazi" je cesta i neocekivana greska u
    # okruzenjima bez NTP-a.

    - name: "Potpisivanje sertifikata {{ _rs_name }}"
      community.crypto.x509_certificate:
        path: "{{ _rs_crt }}"
        csr_path: "{{ _rs_csr }}"
        provider: ownca
        ownca_path: "{{ _root_ca_crt }}"
        ownca_privatekey_path: "{{ _root_ca_key }}"
        ownca_not_before: "-1d"
        ownca_not_after: "+{{ _rs_days }}d"
        ownca_digest: "{{ role_root_ca_digest }}"
        ownca_create_subject_key_identifier: create_if_not_provided
        ownca_create_authority_key_identifier: true
        force: "{{ _rs_renew | bool }}"
        owner: "{{ req.owner | default(role_root_ca_signed_owner) }}"
        group: "{{ req.group | default(role_root_ca_signed_group) }}"
        mode: "{{ req.mode | default(role_root_ca_signed_mode) }}"
        backup: true

    # -----------------------------------------------------------------
    # 7. fullchain i preuzimanje
    # -----------------------------------------------------------------
    # Nginx trazi sertifikat i CA u jednom fajlu; Apache koristi
    # odvojene. Redosled je obavezan: prvo krajnji sertifikat, pa CA.

    - name: "Sastavljanje fullchain fajla za {{ _rs_name }}"
      ansible.builtin.assemble:
        src: "{{ _root_ca_certs_dir }}"
        dest: "{{ _rs_chain }}"
        regexp: "^({{ _rs_name | regex_escape }}\\.crt|{{ role_root_ca_basename | regex_escape }}\\.crt)$"
        owner: "{{ req.owner | default(role_root_ca_signed_owner) }}"
        group: "{{ req.group | default(role_root_ca_signed_group) }}"
        mode: "{{ req.mode | default(role_root_ca_signed_mode) }}"
      when: role_root_ca_fullchain | bool

    # Privatnog kljuca ovde nema — on je ostao na hostu koji je pravio
    # zahtev. Preuzima se samo sertifikat, koji je javan podatak.
    - name: "Preuzimanje potpisanog sertifikata {{ _rs_name }}"
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ role_root_ca_fetch_dir }}/{{ item | basename }}"
        flat: true
      loop:
        - "{{ _rs_crt }}"
        - "{{ _rs_chain if role_root_ca_fullchain | bool else _rs_crt }}"
      loop_control:
        label: "{{ item | basename }}"
      when: role_root_ca_fetch_enabled | bool
