---
# roles/zabbix_proxy/defaults/main.yml

# ============================================================================
# Rola: zabbix_proxy
#
# Instalira Zabbix proxy sa SQLite bazom i upisuje SVOJU konfiguraciju kao
# drop-in fajl u /etc/zabbix/zabbix_proxy.d/, umesto da prepisuje glavni
# konfiguracioni fajl.
#
# Zasto drop-in:
#   - /etc/zabbix/zabbix_proxy.conf je dpkg conffile od preko hiljadu linija.
#     Rola koja ga prepisuje pravi konflikt pri svakoj nadogradnji paketa i
#     mora se dopunjavati za svaki parametar koji Zabbix uvede ili ukloni.
#   - Zabbix obradjuje Include direktivu u trenutku kad je procita. Kada je
#     Include na kraju glavnog fajla, vrednosti iz drop-ina nadjacavaju
#     podrazumevane.
#
# Kao i kod servera, paket NEMA aktivnu Include liniju - sve su
# zakomentarisane, sa upstream putanjom /usr/local/etc/. Rola je dodaje sama
# (vidi role_zabbix_proxy_manage_include).
#
# SAMO SQLITE. MySQL i PostgreSQL backend su namerno izbaceni: trazili bi
# pripremljenu bazu, uvoz seme i lozinke, sto je posao role zabbix_db.
# SQLite bazu proxy kreira sam pri prvom pokretanju - rola samo priprema
# folder sa ispravnim vlasnikom.
#
# VAZNO: proxy se mora RUCNO dodati u Zabbix serveru (Administration →
# Proxies) sa ISTIM imenom kao role_zabbix_proxy_hostname i ISTIM rezimom
# rada. Bez toga server odbija podatke, a greska nije ocigledna.
# ============================================================================

# ---------------------------------------------------------------------------
# Aktivacija i paket
# ---------------------------------------------------------------------------

# Prekidac role. Postavlja ga group_vars/deploy_zabbix_proxy.yml.
role_zabbix_proxy_enabled: false

# Zakovana verzija paketa. Prazno = najnovija iz repozitorijuma.
#   role_zabbix_proxy_version: "1:7.0.9-1+ubuntu24.04"
# Dostupne verzije: apt-cache madison zabbix-proxy-sqlite3
#
# Verzija proxy-ja ne mora biti identicna verziji servera, ali ne sme biti
# NOVIJA od nje. Stariji proxy uz noviji server radi u okviru iste glavne
# verzije.
role_zabbix_proxy_version: ""

# ---------------------------------------------------------------------------
# Identitet i veza sa serverom
#
# Ova tri parametra su izdvojena iz opsteg recnika namerno: bez njih proxy
# nema smisla, pa nad njima postoji assert. Da su u recniku, korisnik koji u
# group_vars definise role_zabbix_proxy_config potpuno bi zamenio
# podrazumevani recnik (Ansible ne spaja recnike) i tiho ostao bez adrese
# servera.
# ---------------------------------------------------------------------------

# Ime pod kojim se proxy predstavlja serveru.
#
# OBAVEZNO se mora poklapati sa imenom proxy-ja upisanim u Zabbix serveru.
# Ako se razlikuje, server odbija podatke, a u logu proxy-ja stoji poruka o
# nepoznatom proxy-ju.
role_zabbix_proxy_hostname: "{{ inventory_hostname }}"

# Adresa Zabbix servera kojem proxy pripada. OBAVEZNO.
#
# U aktivnom rezimu proxy sam otvara vezu ka ovoj adresi.
# U pasivnom rezimu ovo je spisak adresa sa kojih se prihvataju konekcije.
#
# Prihvata string ili listu; lista se spaja zarezima. Za HA klaster servera
# cvorovi se u ovom parametru razdvajaju TACKOM-ZAREZOM:
#   role_zabbix_proxy_server: "zbx-node1;zbx-node2"
role_zabbix_proxy_server: ""

# 0 = aktivan  - proxy sam zove server (podrazumevano)
# 1 = pasivan  - server zove proxy
#
# Aktivan rezim je uobicajen: proxy je cesto iza NAT-a ili zastitnog zida, pa
# je lakse da on otvara vezu, i tada mu ne treba otvoren dolazni port.
#
# PAZNJA: rezim se mora poklapati sa podesavanjem u Zabbix serveru.
# Neuskladjen rezim znaci da komunikacije nema - bez jasne greske, samo
# tisina.
role_zabbix_proxy_mode: 0

# ---------------------------------------------------------------------------
# SQLite baza
# ---------------------------------------------------------------------------

# Puna putanja do SQLite fajla. Proxy ga kreira sam pri prvom pokretanju.
#
# Folder mora postojati i pripadati korisniku zabbix - rola to resava. Nije
# dovoljno da fajl bude upisiv: SQLite pravi i pomocne fajlove (-journal,
# -wal) u istom folderu, pa upis mora biti dozvoljen nad FOLDEROM.
role_zabbix_proxy_db_name: /var/lib/zabbix/zabbix_proxy.sqlite3

# ---------------------------------------------------------------------------
# Ostali parametri konfiguracije
# ---------------------------------------------------------------------------

# Slobodan recnik parametara koji se doslovno prepisuju u drop-in fajl.
# Kljuc je ime Zabbix parametra (osetljivo na velika/mala slova), vrednost je
# skalar ili lista. Lista se ispisuje kao vise linija sa istim kljucem.
#
# Sve sto nije ovde nabrojano ostaje na vrednosti iz stock konfiguracije, pa
# recnik drzi samo ono sto stvarno odstupa.
#
# Primer za proxy sa vecim brojem hostova i losom vezom ka serveru:
#   role_zabbix_proxy_config:
#     ListenPort: 10051
#     ProxyOfflineBuffer: 24
#     CacheSize: 64M
#     HistoryCacheSize: 32M
#     StartPollers: 15
#     StartPreprocessors: 5
#     Timeout: 10
#     StatsAllowedIP: "127.0.0.1,10.0.0.50"
#
# NAPOMENE:
#   - ne koristi YAML true/false - Jinja ih ispisuje kao "True"/"False", sto
#     Zabbix ne razume; koristi 0 i 1
#   - parametri se izmedju Zabbix izdanja dodaju i uklanjaju; recnik znaci da
#     rola ne mora da zna koji postoje u kojoj verziji, ali i da za ispravnost
#     vrednosti odgovaras ti - neispravan parametar sprecava pokretanje
#   - kljucevi Hostname, Server, ProxyMode, DBName, TLS* i Include su
#     rezervisani i assert prekida ako se nadju ovde
role_zabbix_proxy_config: {}

# Slobodan tekst koji se dodaje na kraj drop-in fajla, doslovno.
#
#   role_zabbix_proxy_extra_config: |
#     StartSNMPTrapper=1
#     SNMPTrapperFile=/var/log/snmptrap/snmptrap.log
role_zabbix_proxy_extra_config: ""

# ---------------------------------------------------------------------------
# TLS (PSK)
# ---------------------------------------------------------------------------

# Ako je role_zabbix_proxy_tls_psk neprazan, rola upisuje PSK fajl i dodaje
# TLSConnect / TLSAccept / TLSPSKIdentity / TLSPSKFile u drop-in.
#
# PSK je heksadecimalni string od najmanje 32 znaka. Generise se sa:
#   openssl rand -hex 32
#
# ISTI identitet i kljuc moraju biti upisani i u Zabbix serveru, u
# podesavanjima ovog proxy-ja. Ako se razidju, veze nema.
#
# Vrednost pripada host_vars ili vault-u, nikako ovom fajlu.
role_zabbix_proxy_tls_psk: ""

# Identitet PSK-a. Ne sme biti tajna - salje se nesifrovano pri rukovanju.
role_zabbix_proxy_tls_psk_identity: "PSK {{ inventory_hostname }}"

# Putanja PSK fajla. Tajna ide u zaseban fajl sa mode 0600, ne u drop-in.
role_zabbix_proxy_tls_psk_file: /etc/zabbix/zabbix_proxy.psk

# ---------------------------------------------------------------------------
# Drop-in mehanizam
# ---------------------------------------------------------------------------

# Direktorijum u koji ide drop-in. Za razliku od agenta, ovde se putanja NE
# otkriva - paket je ne definise, pa je rola propisuje.
role_zabbix_proxy_include_dir: /etc/zabbix/zabbix_proxy.d

# Ime drop-in fajla. Prefiks "zz-" nema funkciju (Zabbix ne cita include
# fajlove abecedno), ali jasno oznacava da je fajl pod tudjom upravom.
role_zabbix_proxy_dropin_name: zz-ansible.conf

# Kada je true, rola u glavnu konfiguraciju dodaje liniju
#   Include=<role_zabbix_proxy_include_dir>/*.conf
# na sam kraj fajla, u bloku sa Ansible markerima.
#
# To je JEDINA izmena glavnog fajla koju rola pravi. Bez nje drop-in nikada
# ne bi bio ucitan, jer paket nema aktivnu Include direktivu.
role_zabbix_proxy_manage_include: true

# ---------------------------------------------------------------------------
# Servis
# ---------------------------------------------------------------------------

role_zabbix_proxy_service_enabled: true
role_zabbix_proxy_service_state: started
