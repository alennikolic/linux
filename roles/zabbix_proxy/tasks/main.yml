---
# roles/zabbix_proxy/tasks/main.yml
#
#   1. Provere
#   2. Instalacija paketa
#   3. Folder za SQLite bazu
#   4. PSK kljuc (opciono)
#   5. Konfiguracioni fajl
#   6. Servis
#
# SQLite bazu proxy kreira sam pri prvom pokretanju — rola samo
# priprema folder sa ispravnim vlasnikom.

- name: "Instalacija i konfiguracija Zabbix proxy-ja"
  block:

    # -----------------------------------------------------------------
    # 1. Provere
    # -----------------------------------------------------------------

    - name: "Provera da je distribucija podrzana"
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          Rola "zabbix_proxy" trenutno podrzava iskljucivo
          Debian/Ubuntu, a ovaj host je
          {{ ansible_os_family | default('nepoznat') }}.
        success_msg: "Distribucija je podrzana."

    - name: "Provera izbora backend-a"
      ansible.builtin.assert:
        that:
          - role_zabbix_proxy_db_backend in ['sqlite3', 'mysql', 'pgsql']
        fail_msg: >-
          role_zabbix_proxy_db_backend mora biti "sqlite3", "mysql"
          ili "pgsql", a zadato je
          "{{ role_zabbix_proxy_db_backend }}".
        success_msg: "Backend je ispravan."

    - name: "Provera da je adresa servera zadata"
      ansible.builtin.assert:
        that:
          - role_zabbix_proxy_server is defined
          - role_zabbix_proxy_server | length > 0
        fail_msg: >-
          role_zabbix_proxy_server nije popunjen. Upisi adresu Zabbix
          servera kojem proxy pripada. Bez toga proxy nema kome da
          salje podatke.
        success_msg: "Adresa servera je zadata."

    - name: "Provera rezima rada"
      ansible.builtin.assert:
        that:
          - role_zabbix_proxy_mode | int in [0, 1]
        fail_msg: >-
          role_zabbix_proxy_mode mora biti 0 (aktivan) ili 1
          (pasivan), a zadato je "{{ role_zabbix_proxy_mode }}".
        success_msg: "Rezim rada je ispravan."

    - name: "Provera lozinke baze"
      ansible.builtin.assert:
        that:
          - role_zabbix_proxy_db_password | length > 0
        fail_msg: >-
          Backend je "{{ role_zabbix_proxy_db_backend }}", ali
          role_zabbix_proxy_db_password nije popunjen.
        success_msg: "Lozinka baze je zadata."
      when: not _zabbix_proxy_uses_sqlite | bool

    - name: "Provera PSK konfiguracije"
      ansible.builtin.assert:
        that:
          - role_zabbix_proxy_tls_psk_identity | length > 0
          - role_zabbix_proxy_tls_psk | length > 0
        fail_msg: >-
          TLS je postavljen na "psk", ali nedostaje
          role_zabbix_proxy_tls_psk_identity ili
          role_zabbix_proxy_tls_psk. Kljuc generisi sa:
          openssl rand -hex 32
        success_msg: "PSK konfiguracija je potpuna."
      when: >-
        role_zabbix_proxy_tls_connect == 'psk' or
        role_zabbix_proxy_tls_accept == 'psk'

    # -----------------------------------------------------------------
    # 2. Instalacija
    # -----------------------------------------------------------------

    - name: "Instalacija {{ _zabbix_proxy_package }}"
      ansible.builtin.apt:
        name: >-
          {{ _zabbix_proxy_package }}{{
             '=' ~ role_zabbix_proxy_version
             if role_zabbix_proxy_version | length > 0 else '' }}
        state: present
        update_cache: true
        cache_valid_time: 3600
      notify: "Restartuj Zabbix proxy"

    # fping je potreban za ICMP provere, a ne dolazi kao zavisnost.
    - name: "Instalacija fping-a"
      ansible.builtin.apt:
        name: fping
        state: present

    # -----------------------------------------------------------------
    # 3. Folder za SQLite bazu
    # -----------------------------------------------------------------
    # Sam fajl baze kreira proxy pri prvom pokretanju. Rola priprema
    # samo folder — proxy ne moze da ga napravi jer radi kao zabbix
    # korisnik.

    - name: "Folder za SQLite bazu"
      ansible.builtin.file:
        path: "{{ _zabbix_proxy_db_dir }}"
        state: directory
        owner: zabbix
        group: zabbix
        mode: '0750'
      when: _zabbix_proxy_uses_sqlite | bool

    # -----------------------------------------------------------------
    # 4. PSK kljuc
    # -----------------------------------------------------------------

    - name: "Upis PSK kljuca"
      ansible.builtin.copy:
        content: "{{ role_zabbix_proxy_tls_psk }}"
        dest: "{{ role_zabbix_proxy_tls_psk_file }}"
        owner: zabbix
        group: zabbix
        mode: '0400'
      no_log: true
      when: >-
        role_zabbix_proxy_tls_connect == 'psk' or
        role_zabbix_proxy_tls_accept == 'psk'
      notify: "Restartuj Zabbix proxy"

    # -----------------------------------------------------------------
    # 5. Konfiguracija
    # -----------------------------------------------------------------

    - name: "Upis konfiguracionog fajla"
      ansible.builtin.template:
        src: zabbix_proxy.conf.j2
        dest: "{{ _zabbix_proxy_config_file }}"
        owner: root
        group: zabbix
        mode: '0640'
        backup: true
      no_log: true
      notify: "Restartuj Zabbix proxy"

    # -----------------------------------------------------------------
    # 6. Servis
    # -----------------------------------------------------------------

    - name: "Servis {{ _zabbix_proxy_service }}"
      ansible.builtin.service:
        name: "{{ _zabbix_proxy_service }}"
        enabled: "{{ role_zabbix_proxy_service_enabled | bool }}"
        state: "{{ role_zabbix_proxy_service_state }}"

    # -----------------------------------------------------------------
    # Podsetnik
    # -----------------------------------------------------------------

    - name: "PODSETNIK: proxy mora biti dodat u Zabbix serveru"
      ansible.builtin.debug:
        msg: >-
          Proxy "{{ role_zabbix_proxy_hostname }}" je instaliran u
          {{ 'aktivnom' if role_zabbix_proxy_mode | int == 0 else 'pasivnom' }}
          rezimu. Dodaj ga u Zabbix serveru pod Administration →
          Proxies, sa TACNO ovim imenom i istim rezimom. Bez toga
          server odbija podatke.
