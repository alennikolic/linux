---
# roles/zabbix_db/vars/main.yml
#
# Izvedene vrednosti. Ovo NISU podesavanja — ne menjaj ih kroz
# group_vars ili host_vars.
#
# Posle prelaska na iskljucivo MySQL ovde vise nema uslovnih izraza:
# sve vrednosti su fiksne. Fajl ostaje zato sto je ovo javni ugovor
# role — putanje i imena servisa nisu podesavanja, pa nemaju sta da
# traze u defaults/main.yml.

_zabbix_db_server_package: mysql-server

# Klijent je potreban za uvoz seme. Paket mysql-server ga povlaci sam,
# pa se instalira zasebno samo kada instalacija servera nije trazena.
_zabbix_db_client_package: mysql-client

_zabbix_db_service: mysql

# MySQL na Ubuntu cita /etc/mysql/mysql.conf.d/
_zabbix_db_config_dir: /etc/mysql/mysql.conf.d

# Prefiks zz- je bitan, ne kozmeticki. MySQL ucitava fajlove iz ovog
# foldera AZBUCNIM redom i primenjuje POSLEDNJU procitanu vrednost
# svake opcije. Ime koje pocinje ciframa (99-zabbix.cnf) dolazi PRE
# mysqld.cnf, pa bi bind-address odavde bio pregazen. Suprotno od
# ponasanja systemd-a, sysctl-a i logrotate-a.
_zabbix_db_config_file: "{{ _zabbix_db_config_dir }}/zz-zabbix.cnf"

# Socket kroz koji se Ansible prijavljuje kao root. Na Ubuntu i
# Debianu root koristi auth_socket dodatak, pa lozinka nije potrebna.
# Ovo je i razlog zasto uvoz seme radi iz ove role: root ima punu
# privilegiju, za razliku od naloga "zabbix".
_zabbix_db_login_socket: /run/mysqld/mysqld.sock

# Folder u koji paket zabbix-sql-scripts raspakuje semu.
_zabbix_db_sql_scripts_dir: /usr/share/zabbix-sql-scripts/mysql
