---
# roles/zabbix_agent/defaults/main.yml

# ============================================================================
# Rola: zabbix_agent
#
# Instalira Zabbix agenta i upisuje SVOJU konfiguraciju kao drop-in fajl
# unutar include direktorijuma koji je paket vec predvideo.
#
# Zasto drop-in, a ne ceo fajl:
#   - /etc/zabbix/zabbix_agentd.conf je dpkg conffile. Ako ga rola prepise,
#     svaka nadogradnja paketa zavrsi u konfliktu ili tiho zadrzi nasu verziju,
#     pa nove opcije koje vendor doda nikad ne stignu na sistem.
#   - Zabbix obradjuje Include direktivu u trenutku kad je procita, a u
#     paketima ona stoji na kraju fajla. Posledica: parametar iz drop-in
#     fajla nadjacava isti parametar iz podrazumevane konfiguracije.
#
# Rola upisuje TACNO JEDAN fajl u include direktorijum. Zabbix ne garantuje
# redosled ucitavanja vise include fajlova, pa deljenje parametara na vise
# fajlova daje nepredvidiv rezultat.
# ============================================================================

# ---------------------------------------------------------------------------
# Aktivacija
# ---------------------------------------------------------------------------

# Prekidac role. Postavlja ga group_vars/deploy_zabbix_agent.yml.
role_zabbix_agent_enabled: false

# ---------------------------------------------------------------------------
# Varijanta agenta
# ---------------------------------------------------------------------------

# "agent"  -> paket zabbix-agent,  konfiguracija /etc/zabbix/zabbix_agentd.conf
# "agent2" -> paket zabbix-agent2, konfiguracija /etc/zabbix/zabbix_agent2.conf
#
# agent2 je pisan u Go, podrzava dodatke (plugins) i persistentne aktivne
# provere. agent (klasicni, C) je i dalje podrazumevani izbor jer je
# jednostavniji i ima manji broj pokretnih delova.
role_zabbix_agent_variant: agent2

# Stanje paketa: present (ne dira postojecu verziju) ili latest.
# "latest" znaci da nadogradnja moze da se desi u bilo kom prolazu role,
# sto na produkciji obicno nije pozeljno.
role_zabbix_agent_package_state: present

# ---------------------------------------------------------------------------
# Osnovni parametri
#
# Ova tri parametra su izdvojena iz opsteg recnika namerno: bez njih agent
# nema smisla, pa nad njima postoji assert provera. Da su unutar recnika,
# korisnik koji u group_vars definise role_zabbix_agent_config potpuno bi
# zamenio podrazumevani recnik (Ansible ne spaja recnike) i tiho ostao bez
# Hostname vrednosti.
# ---------------------------------------------------------------------------

# Adrese Zabbix servera ili proksija za PASIVNE provere (server pita agenta).
# Prihvata string ili listu; lista se spaja zarezima.
#   role_zabbix_agent_server: 10.0.0.10
#   role_zabbix_agent_server: [10.0.0.10, 10.0.0.11]
role_zabbix_agent_server: ""

# Adrese za AKTIVNE provere (agent salje serveru). Format host[:port].
#   role_zabbix_agent_server_active: 10.0.0.10:10051
role_zabbix_agent_server_active: ""

# Ime pod kojim se agent predstavlja serveru. Mora se poklapati sa imenom
# hosta u Zabbix-u, inace aktivne provere nemaju gde da se prijave.
#
# Podrazumevana vrednost u stock konfiguraciji je "Zabbix server" - klasicna
# zamka, jer svi hostovi izvestavaju pod istim imenom.
role_zabbix_agent_hostname: "{{ inventory_hostname }}"

# ---------------------------------------------------------------------------
# Ostali parametri konfiguracije
# ---------------------------------------------------------------------------

# Slobodan recnik parametara koji se doslovno prepisuju u drop-in fajl.
# Kljuc je ime Zabbix parametra (osetljivo na velika/mala slova), vrednost
# je skalar ili lista.
#
# Lista se ispisuje kao vise linija sa istim kljucem - to je jedini ispravan
# nacin za parametre koji se legitimno ponavljaju: UserParameter, Alias,
# Include, DenyKey, AllowKey.
#
# Primer:
#   role_zabbix_agent_config:
#     Timeout: 10
#     RefreshActiveChecks: 60
#     LogFileSize: 10
#     UserParameter:
#       - "mysql.ping,mysqladmin ping | grep -c alive"
#       - "custom.disk[*],/usr/local/bin/disk.sh $1"
#
# Za agent2 ovde idu i parametri dodataka:
#     Plugins.Uptime.Capacity: 1
#
# Napomena: ne koristi YAML true/false kao vrednosti - Jinja ih ispisuje kao
# "True"/"False", sto Zabbix ne razume. Koristi 0 i 1.
#
# Kljucevi Server, ServerActive, Hostname i TLS* su rezervisani i assert ce
# prekinuti izvrsavanje ako se nadju ovde, jer bi se pojavili dvaput.
role_zabbix_agent_config: {}

# Slobodan tekst koji se dodaje na kraj drop-in fajla, doslovno.
# Izlaz u nuzdu za sve sto se ne uklapa u recnik.
role_zabbix_agent_extra_config: ""

# ---------------------------------------------------------------------------
# TLS / PSK
# ---------------------------------------------------------------------------

# Ako je role_zabbix_agent_tls_psk neprazan, rola upisuje PSK fajl i dodaje
# TLSConnect / TLSAccept / TLSPSKIdentity / TLSPSKFile u drop-in.
#
# PSK je heksadecimalni string od najmanje 32 znaka (16 bajtova). Generise se sa:
#   openssl rand -hex 32
#
# Vrednost pripada host_vars ili vault-u, nikako ovom fajlu.
role_zabbix_agent_tls_psk: ""

# Identitet PSK-a. Ne sme biti tajna - salje se nesifrovano pri rukovanju.
role_zabbix_agent_tls_psk_identity: "PSK {{ inventory_hostname }}"

# Putanja PSK fajla. Tajna ide u zaseban fajl sa mode 0600, ne u drop-in,
# da bi sam drop-in mogao ostati citljiv (0644) za sve.
role_zabbix_agent_tls_psk_file: /etc/zabbix/zabbix_agent.psk

# ---------------------------------------------------------------------------
# Drop-in fajl i detekcija include direktorijuma
# ---------------------------------------------------------------------------

# Ime drop-in fajla. Prefiks "zz-" nema funkciju (Zabbix ne cita abecedno),
# ali jasno oznacava da je fajl pod tudjom upravom.
role_zabbix_agent_dropin_name: zz-ansible.conf

# Include direktorijum se PODRAZUMEVANO otkriva citanjem Include linija iz
# instalirane konfiguracije. Razlog: putanja nije ista svuda.
#   upstream izvor : /usr/local/etc/zabbix_agentd.conf.d/
#   Debian/Ubuntu  : /etc/zabbix/zabbix_agentd.d/
#   agent2         : /etc/zabbix/zabbix_agent2.d/
# Detekcija znaci da rola prezivi promenu putanje kod vendora.
#
# Ovu varijablu postavi samo ako detekcija ne uspe. Vrednost se tada koristi
# doslovno - odgovornost je na tebi da glavna konfiguracija taj direktorijum
# zaista ukljucuje.
role_zabbix_agent_include_dir: ""

# Ako Include direktiva pokazuje na go direktorijum (bez *.conf maske),
# Zabbix ucitava BAS SVE fajlove iz njega - ukljucujuci rezervne kopije.
# Jedan zaostali .dpkg-old ili fajl sa tildom znaci duplirane parametre i
# nepredvidivo ponasanje agenta.
#
# Kada je true, rola u tom slucaju trazi takve fajlove i prekida izvrsavanje
# sa jasnom porukom. Provera se preskace ako maska *.conf postoji, jer tada
# zaostali fajlovi ionako nisu ukljuceni.
role_zabbix_agent_include_strict: true

# ---------------------------------------------------------------------------
# Servis
# ---------------------------------------------------------------------------

role_zabbix_agent_service_enabled: true
role_zabbix_agent_service_state: started
