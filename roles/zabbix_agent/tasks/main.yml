---
# roles/zabbix_agent/tasks/main.yml

- name: Zabbix agent
  when: role_zabbix_agent_enabled | default(false) | bool
  block:

    # -----------------------------------------------------------------------
    # Provere pre bilo kakve izmene sistema
    # -----------------------------------------------------------------------

    - name: Provera - podrzana distribucija
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          Rola zabbix_agent podrzava samo Debian/Ubuntu sisteme.
          Detektovano: {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}
        quiet: true

    - name: Provera - ispravna varijanta agenta
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_variant in ['agent', 'agent2']
        fail_msg: >-
          role_zabbix_agent_variant mora biti "agent" ili "agent2",
          a dobijeno je "{{ role_zabbix_agent_variant }}".
        quiet: true

    - name: Provera - definisan bar jedan Zabbix server
      ansible.builtin.assert:
        that:
          - (_zabbix_agent_server_value | length > 0) or
            (_zabbix_agent_server_active_value | length > 0)
        fail_msg: >-
          Mora biti postavljen role_zabbix_agent_server (pasivne provere)
          ili role_zabbix_agent_server_active (aktivne provere). Bez
          ijednog od njih agent nema sa kim da komunicira.
        quiet: true

    - name: Provera - definisan Hostname
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_hostname | length > 0
        fail_msg: >-
          role_zabbix_agent_hostname ne sme biti prazan - agent bi zadrzao
          podrazumevanu vrednost "Zabbix server" iz stock konfiguracije.
        quiet: true

    - name: Provera - role_zabbix_agent_config je recnik
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_config is mapping
        fail_msg: >-
          role_zabbix_agent_config mora biti recnik (kljuc: vrednost).
        quiet: true

    - name: Provera - rezervisani kljucevi nisu u role_zabbix_agent_config
      ansible.builtin.assert:
        that:
          - (role_zabbix_agent_config.keys() | list
             | intersect(_zabbix_agent_reserved_keys) | length) == 0
        fail_msg: >-
          Sledeci kljucevi su rezervisani i rola ih ispisuje sama:
          {{ role_zabbix_agent_config.keys() | list
             | intersect(_zabbix_agent_reserved_keys) | join(', ') }}.
          Koristi namenske varijable (role_zabbix_agent_server,
          role_zabbix_agent_server_active, role_zabbix_agent_hostname,
          role_zabbix_agent_tls_psk*).
        quiet: true

    - name: Provera - PSK identitet postavljen ako je PSK definisan
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_tls_psk_identity | length > 0
        fail_msg: >-
          Kada je role_zabbix_agent_tls_psk postavljen, mora postojati i
          role_zabbix_agent_tls_psk_identity.
        quiet: true
      when: _zabbix_agent_tls_enabled | bool

    - name: Provera - PSK je dovoljno dugacak heksadecimalni string
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_tls_psk is match('^[0-9a-fA-F]{32,}$')
        fail_msg: >-
          role_zabbix_agent_tls_psk mora biti heksadecimalni string od
          najmanje 32 znaka. Generisi ga sa: openssl rand -hex 32
        quiet: true
      no_log: true
      when: _zabbix_agent_tls_enabled | bool

    # -----------------------------------------------------------------------
    # Instalacija
    # -----------------------------------------------------------------------

    - name: Instalacija Zabbix agenta
      ansible.builtin.apt:
        name: "{{ _zabbix_agent_package }}"
        state: "{{ role_zabbix_agent_package_state }}"
        update_cache: true
        cache_valid_time: 3600

    # -----------------------------------------------------------------------
    # Otkrivanje include direktorijuma
    #
    # Cita se instalirana konfiguracija i iz nje izvlace Include linije.
    # Fajl se NE MENJA - slurp je citanje, ostaje idempotentno.
    # -----------------------------------------------------------------------

    - name: Ucitaj glavnu konfiguraciju agenta
      ansible.builtin.slurp:
        src: "{{ _zabbix_agent_main_conf }}"
      register: _zabbix_agent_conf_raw
      when: role_zabbix_agent_include_dir | length == 0

    - name: Izdvoj aktivne Include vrednosti
      ansible.builtin.set_fact:
        # Zabbix priznaje komentar samo na pocetku linije, pa je dovoljno
        # odbaciti sve sto ne pocinje sa "Include".
        _zabbix_agent_include_values: >-
          {{ (_zabbix_agent_conf_raw.content | b64decode).splitlines()
             | map('trim')
             | select('match', '^Include\s*=')
             | map('regex_replace', '^Include\s*=\s*', '')
             | map('trim')
             | reject('equalto', '')
             | list }}
      when: role_zabbix_agent_include_dir | length == 0

    - name: Odaberi Include vrednost koja pokazuje na direktorijum
      ansible.builtin.set_fact:
        # Prednost ima vrednost sa maskom (.../*.conf), zatim vrednost koja
        # se zavrsava kosom crtom. Vrednosti koje pokazuju na pojedinacan
        # fajl se preskacu - u njih ne mozemo nista da upisemo.
        _zabbix_agent_include_glob: >-
          {{ ((_zabbix_agent_include_values | select('search', '\*') | list)
              + (_zabbix_agent_include_values | select('search', '/$') | list)
              + ['']) | first }}
      when: role_zabbix_agent_include_dir | length == 0

    - name: Odredi include direktorijum
      ansible.builtin.set_fact:
        _zabbix_agent_include_dir: >-
          {{ role_zabbix_agent_include_dir
             if (role_zabbix_agent_include_dir | length > 0)
             else (_zabbix_agent_include_glob | dirname
                   if ('*' in _zabbix_agent_include_glob)
                   else (_zabbix_agent_include_glob | regex_replace('/+$', ''))) }}
        # Ako maska *.conf postoji, zaostali fajlovi bez te ekstenzije nisu
        # ukljuceni i stroga provera nije potrebna. Kod rucno zadate putanje
        # ne znamo kako Include izgleda, pa se ide na stroziju pretpostavku.
        _zabbix_agent_include_has_glob: >-
          {{ ('*' in _zabbix_agent_include_glob)
             if (role_zabbix_agent_include_dir | length == 0)
             else false }}

    - name: Provera - include direktorijum je pronadjen
      ansible.builtin.assert:
        that:
          - _zabbix_agent_include_dir | length > 0
        fail_msg: >-
          U {{ _zabbix_agent_main_conf }} nije pronadjena nijedna aktivna
          Include direktiva koja pokazuje na direktorijum. Bez nje drop-in
          fajl ne bi bio ucitan. Dodaj Include liniju u glavnu konfiguraciju
          i postavi role_zabbix_agent_include_dir na tu putanju.
        quiet: true

    - name: Obezbedi postojanje include direktorijuma
      ansible.builtin.file:
        path: "{{ _zabbix_agent_include_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # -----------------------------------------------------------------------
    # Provera zaostalih fajlova
    #
    # Relevantno samo kada Include pokazuje na go direktorijum: tada Zabbix
    # ucitava svaki fajl u njemu. Jedan .dpkg-old ili fajl sa tildom znaci
    # dupliran parametar i agenta koji se ponasa nepredvidivo ili ne startuje.
    # -----------------------------------------------------------------------

    - name: Potrazi rezervne kopije u include direktorijumu
      ansible.builtin.find:
        paths: "{{ _zabbix_agent_include_dir }}"
        patterns:
          - "*~"
          - "*.bak"
          - "*.orig"
          - "*.save"
          - "*.dpkg-old"
          - "*.dpkg-new"
          - "*.dpkg-dist"
          - "*.ucf-old"
          - "*.rpmsave"
        file_type: file
      register: _zabbix_agent_stray
      when:
        - role_zabbix_agent_include_strict | bool
        - not (_zabbix_agent_include_has_glob | bool)

    - name: Provera - nema rezervnih kopija u include direktorijumu
      ansible.builtin.assert:
        that:
          - _zabbix_agent_stray.files | length == 0
        fail_msg: >-
          Include direktiva pokazuje na direktorijum bez *.conf maske, pa
          Zabbix ucitava sve fajlove iz {{ _zabbix_agent_include_dir }}.
          Pronadjene rezervne kopije koje treba ukloniti:
          {{ _zabbix_agent_stray.files | map(attribute='path') | join(', ') }}
        quiet: true
      when:
        - role_zabbix_agent_include_strict | bool
        - not (_zabbix_agent_include_has_glob | bool)

    # -----------------------------------------------------------------------
    # PSK
    # -----------------------------------------------------------------------

    - name: Upisi PSK fajl
      ansible.builtin.copy:
        content: "{{ role_zabbix_agent_tls_psk }}\n"
        dest: "{{ role_zabbix_agent_tls_psk_file }}"
        owner: zabbix
        group: zabbix
        mode: "0600"
      no_log: true
      when: _zabbix_agent_tls_enabled | bool
      notify: Restartuj Zabbix agenta

    # -----------------------------------------------------------------------
    # Drop-in konfiguracija
    #
    # backup je NAMERNO iskljucen: Ansible-ova rezervna kopija bi zavrsila u
    # istom direktorijumu i - kada Include nema *.conf masku - bila ucitana
    # zajedno sa originalom. Prethodna verzija je ionako u git-u i u
    # varijablama, pa gubitka nema.
    # -----------------------------------------------------------------------

    - name: Upisi drop-in konfiguraciju
      ansible.builtin.template:
        src: dropin.conf.j2
        dest: "{{ _zabbix_agent_include_dir }}/{{ role_zabbix_agent_dropin_name }}"
        owner: root
        group: root
        mode: "0644"
        backup: false
      notify: Restartuj Zabbix agenta

    # -----------------------------------------------------------------------
    # Servis
    # -----------------------------------------------------------------------

    - name: Servis agenta pokrenut i omogucen
      ansible.builtin.service:
        name: "{{ _zabbix_agent_service }}"
        enabled: "{{ role_zabbix_agent_service_enabled | bool }}"
        state: "{{ role_zabbix_agent_service_state }}"
