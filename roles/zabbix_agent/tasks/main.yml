---
# roles/zabbix_agent/tasks/main.yml

- name: Zabbix agent
  when: role_zabbix_agent_enabled | default(false) | bool
  block:

    # -----------------------------------------------------------------------
    # Provere pre bilo kakve izmene sistema
    # -----------------------------------------------------------------------

    - name: Provera - podrzana distribucija
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          Rola zabbix_agent podrzava samo Debian/Ubuntu sisteme.
          Detektovano: {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}
        quiet: true

    - name: Provera - ispravna varijanta agenta
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_variant in ['agent', 'agent2']
        fail_msg: >-
          role_zabbix_agent_variant mora biti "agent" ili "agent2",
          a dobijeno je "{{ role_zabbix_agent_variant }}".
        quiet: true

    - name: Provera - definisan bar jedan Zabbix server
      ansible.builtin.assert:
        that:
          - (_zabbix_agent_server_value | length > 0) or
            (_zabbix_agent_server_active_value | length > 0)
        fail_msg: >-
          Mora biti postavljen role_zabbix_agent_server (pasivne provere)
          ili role_zabbix_agent_server_active (aktivne provere). Bez
          ijednog od njih agent nema sa kim da komunicira.
        quiet: true

    # Tacka-zarez u Server parametru nije razdvajac - cela niska bi bila
    # protumacena kao jedna adresa i agent bi odbijao konekcije servera.
    # Provera se radi nad IZRACUNATOM vrednoscu, pa jednako hvata i
    # ugnjezdenu listu i doslovan string.
    - name: Provera - nema tacke-zareza u Server parametru
      ansible.builtin.assert:
        that:
          - "';' not in _zabbix_agent_server_value"
        fail_msg: >-
          role_zabbix_agent_server je dao vrednost
          "{{ _zabbix_agent_server_value }}", a Zabbix u parametru Server
          prihvata iskljucivo zarez kao razdvajac. Navedi sve adrese kao
          ravnu listu ili razdvojene zarezom. Ako ovo ipak radis namerno,
          postavi role_zabbix_agent_server_allow_semicolon na true.
        quiet: true
      when: not (role_zabbix_agent_server_allow_semicolon | bool)

    - name: Provera - Server nema prazan element u spisku adresa
      ansible.builtin.assert:
        that:
          - _zabbix_agent_server_value is not search(_zabbix_agent_address_flaw_re)
        fail_msg: >-
          role_zabbix_agent_server je dao vrednost
          "{{ _zabbix_agent_server_value }}" sa praznim elementom
          (razdvajac na pocetku ili kraju, ili dva zaredom).
        quiet: true
      when: _zabbix_agent_server_value | length > 0

    - name: Provera - ServerActive nema prazan element u spisku adresa
      ansible.builtin.assert:
        that:
          - _zabbix_agent_server_active_value is not search(_zabbix_agent_address_flaw_re)
        fail_msg: >-
          role_zabbix_agent_server_active je dao vrednost
          "{{ _zabbix_agent_server_active_value }}" sa praznim elementom
          (razdvajac na pocetku ili kraju, ili dva zaredom).
        quiet: true
      when: _zabbix_agent_server_active_value | length > 0

    - name: Provera - definisan Hostname
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_hostname | length > 0
        fail_msg: >-
          role_zabbix_agent_hostname ne sme biti prazan - agent bi zadrzao
          podrazumevanu vrednost "Zabbix server" iz stock konfiguracije.
        quiet: true

    - name: Provera - role_zabbix_agent_config je recnik
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_config is mapping
        fail_msg: >-
          role_zabbix_agent_config mora biti recnik (kljuc: vrednost).
        quiet: true

    - name: Provera - rezervisani kljucevi nisu u role_zabbix_agent_config
      ansible.builtin.assert:
        that:
          - (role_zabbix_agent_config.keys() | list
             | intersect(_zabbix_agent_reserved_keys) | length) == 0
        fail_msg: >-
          Sledeci kljucevi su rezervisani i rola ih ispisuje sama:
          {{ role_zabbix_agent_config.keys() | list
             | intersect(_zabbix_agent_reserved_keys) | join(', ') }}.
          Koristi namenske varijable (role_zabbix_agent_server,
          role_zabbix_agent_server_active, role_zabbix_agent_hostname,
          role_zabbix_agent_tls_psk*).
        quiet: true

    - name: Provera - PSK identitet postavljen ako je PSK definisan
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_tls_psk_identity | length > 0
        fail_msg: >-
          Kada je role_zabbix_agent_tls_psk postavljen, mora postojati i
          role_zabbix_agent_tls_psk_identity.
        quiet: true
      when: _zabbix_agent_tls_enabled | bool

    - name: Provera - PSK je dovoljno dugacak heksadecimalni string
      ansible.builtin.assert:
        that:
          - role_zabbix_agent_tls_psk is match('^[0-9a-fA-F]{32,}$')
        fail_msg: >-
          role_zabbix_agent_tls_psk mora biti heksadecimalni string od
          najmanje 32 znaka. Generisi ga sa: openssl rand -hex 32
        quiet: true
      no_log: true
      when: _zabbix_agent_tls_enabled | bool

    # -----------------------------------------------------------------------
    # Instalacija
    # -----------------------------------------------------------------------

    - name: Instalacija Zabbix agenta
      ansible.builtin.apt:
        name: "{{ _zabbix_agent_package }}"
        state: "{{ role_zabbix_agent_package_state }}"
        update_cache: true
        cache_valid_time: 3600

    # -----------------------------------------------------------------------
    # Otkrivanje include direktorijuma
    #
    # Cita se instalirana konfiguracija i iz nje izvlace Include linije.
    # Fajl se NE MENJA - slurp je citanje, ostaje idempotentno.
    #
    # agent2 ima DVE aktivne Include direktive, pa izbor ne sme da zavisi od
    # redosleda linija u fajlu. Direktorijumi iz _zabbix_agent_include_skip_names
    # (plugins.d) se odbacuju - to je prostor plugin paketa.
    # -----------------------------------------------------------------------

    - name: Ucitaj glavnu konfiguraciju agenta
      ansible.builtin.slurp:
        src: "{{ _zabbix_agent_main_conf }}"
      register: _zabbix_agent_conf_raw
      when: role_zabbix_agent_include_dir | length == 0

    - name: Izdvoj aktivne Include vrednosti
      ansible.builtin.set_fact:
        # Zabbix priznaje komentar samo na pocetku linije, pa je dovoljno
        # odbaciti sve sto ne pocinje sa "Include".
        _zabbix_agent_include_values: >-
          {{ (_zabbix_agent_conf_raw.content | b64decode).splitlines()
             | map('trim')
             | select('match', '^Include\s*=')
             | map('regex_replace', '^Include\s*=\s*', '')
             | map('trim')
             | reject('equalto', '')
             | list }}
      when: role_zabbix_agent_include_dir | length == 0

    - name: Svedi Include vrednosti na direktorijume
      ansible.builtin.set_fact:
        # Vrednost sa maskom (.../*.conf) -> uzima se roditeljski direktorijum.
        # Vrednost koja se zavrsava kosom crtom -> sama je direktorijum.
        # Vrednosti koje pokazuju na pojedinacan fajl se preskacu - u njih se
        # ne moze upisati drop-in.
        _zabbix_agent_glob_dirs: >-
          {{ _zabbix_agent_include_values
             | select('search', '\*') | map('dirname') | unique | list }}
        _zabbix_agent_plain_dirs: >-
          {{ _zabbix_agent_include_values
             | reject('search', '\*') | select('search', '/$')
             | map('regex_replace', '/+$', '') | unique | list }}
      when: role_zabbix_agent_include_dir | length == 0

    - name: Odaberi include direktorijum
      ansible.builtin.set_fact:
        # Prednost ima direktorijum sa maskom - tada zaostali fajlovi bez
        # .conf ekstenzije nisu ukljuceni, pa je sistem otporniji.
        _zabbix_agent_include_candidates: >-
          {{ (_zabbix_agent_glob_dirs + _zabbix_agent_plain_dirs)
             | reject('basename', 'in', _zabbix_agent_include_skip_names)
             | list }}
      when: role_zabbix_agent_include_dir | length == 0

    - name: Odredi include direktorijum
      ansible.builtin.set_fact:
        _zabbix_agent_include_dir: >-
          {{ role_zabbix_agent_include_dir
             if (role_zabbix_agent_include_dir | length > 0)
             else ((_zabbix_agent_include_candidates | default([])) + ['']) | first }}

    - name: Provera - include direktorijum je pronadjen
      ansible.builtin.assert:
        that:
          - _zabbix_agent_include_dir | length > 0
        fail_msg: >-
          U {{ _zabbix_agent_main_conf }} nije pronadjena nijedna upotrebljiva
          Include direktiva. Pronadjeno:
          {{ _zabbix_agent_include_values | default([]) | join(', ') | default('nista', true) }}.
          Direktorijumi {{ _zabbix_agent_include_skip_names | join(', ') }}
          se namerno preskacu. Dodaj Include liniju u glavnu konfiguraciju
          ili postavi role_zabbix_agent_include_dir na zeljenu putanju.
        quiet: true

    - name: Utvrdi da li izabrani direktorijum ima *.conf masku
      ansible.builtin.set_fact:
        # Bitno samo za proveru zaostalih fajlova nize. Kod rucno zadate
        # putanje ne znamo kako Include izgleda, pa se ide na stroziju
        # pretpostavku (bez maske).
        _zabbix_agent_include_has_glob: >-
          {{ (_zabbix_agent_glob_dirs | default([])) is contains(_zabbix_agent_include_dir)
             if (role_zabbix_agent_include_dir | length == 0)
             else false }}

    - name: Prikazi izabrani include direktorijum
      ansible.builtin.debug:
        msg: >-
          Drop-in ide u {{ _zabbix_agent_include_dir }}/{{ role_zabbix_agent_dropin_name }}
          ({{ 'maska *.conf' if (_zabbix_agent_include_has_glob | bool) else 'ceo direktorijum' }})

    - name: Obezbedi postojanje include direktorijuma
      ansible.builtin.file:
        path: "{{ _zabbix_agent_include_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # -----------------------------------------------------------------------
    # Provera zaostalih fajlova
    #
    # Relevantno samo kada Include pokazuje na go direktorijum: tada Zabbix
    # ucitava svaki fajl u njemu. Jedan .dpkg-old ili fajl sa tildom znaci
    # dupliran parametar i agenta koji se ponasa nepredvidivo ili ne startuje.
    # -----------------------------------------------------------------------

    - name: Potrazi rezervne kopije u include direktorijumu
      ansible.builtin.find:
        paths: "{{ _zabbix_agent_include_dir }}"
        patterns:
          - "*~"
          - "*.bak"
          - "*.orig"
          - "*.save"
          - "*.dpkg-old"
          - "*.dpkg-new"
          - "*.dpkg-dist"
          - "*.ucf-old"
          - "*.rpmsave"
        file_type: file
      register: _zabbix_agent_stray
      when:
        - role_zabbix_agent_include_strict | bool
        - not (_zabbix_agent_include_has_glob | bool)

    - name: Provera - nema rezervnih kopija u include direktorijumu
      ansible.builtin.assert:
        that:
          - _zabbix_agent_stray.files | length == 0
        fail_msg: >-
          Include direktiva pokazuje na direktorijum bez *.conf maske, pa
          Zabbix ucitava sve fajlove iz {{ _zabbix_agent_include_dir }}.
          Pronadjene rezervne kopije koje treba ukloniti:
          {{ _zabbix_agent_stray.files | map(attribute='path') | join(', ') }}
        quiet: true
      when:
        - role_zabbix_agent_include_strict | bool
        - not (_zabbix_agent_include_has_glob | bool)

    # -----------------------------------------------------------------------
    # Uklanjanje drop-in fajla sa pogresnog mesta
    #
    # Ranije verzije role birale su prvu Include direktivu u fajlu, sto je kod
    # agent2 moglo da znaci plugins.d. Ako je fajl tamo ostao, ucitavao bi se
    # zajedno sa ispravnim i nadjacavao ga - plugins.d Include je poslednji u
    # konfiguraciji. Task briše samo fajl sa NASIM imenom, ne dira ostalo.
    # -----------------------------------------------------------------------

    - name: Ukloni drop-in iz preskocenih direktorijuma
      ansible.builtin.file:
        path: "{{ _zabbix_agent_include_dir }}/{{ item }}/{{ role_zabbix_agent_dropin_name }}"
        state: absent
      loop: "{{ _zabbix_agent_include_skip_names }}"
      notify: Restartuj Zabbix agenta

    # -----------------------------------------------------------------------
    # PSK
    # -----------------------------------------------------------------------

    - name: Upisi PSK fajl
      ansible.builtin.copy:
        content: "{{ role_zabbix_agent_tls_psk }}\n"
        dest: "{{ role_zabbix_agent_tls_psk_file }}"
        owner: zabbix
        group: zabbix
        mode: "0600"
      no_log: true
      when: _zabbix_agent_tls_enabled | bool
      notify: Restartuj Zabbix agenta

    # -----------------------------------------------------------------------
    # Drop-in konfiguracija
    #
    # backup je NAMERNO iskljucen: Ansible-ova rezervna kopija bi zavrsila u
    # istom direktorijumu i - kada Include nema *.conf masku - bila ucitana
    # zajedno sa originalom. Prethodna verzija je ionako u git-u i u
    # varijablama, pa gubitka nema.
    # -----------------------------------------------------------------------

    - name: Upisi drop-in konfiguraciju
      ansible.builtin.template:
        src: dropin.conf.j2
        dest: "{{ _zabbix_agent_include_dir }}/{{ role_zabbix_agent_dropin_name }}"
        owner: root
        group: root
        mode: "0644"
        backup: false
      notify: Restartuj Zabbix agenta

    # -----------------------------------------------------------------------
    # Servis
    # -----------------------------------------------------------------------

    - name: Servis agenta pokrenut i omogucen
      ansible.builtin.service:
        name: "{{ _zabbix_agent_service }}"
        enabled: "{{ role_zabbix_agent_service_enabled | bool }}"
        state: "{{ role_zabbix_agent_service_state }}"
