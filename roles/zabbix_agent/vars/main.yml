---
# roles/zabbix_agent/vars/main.yml
#
# Izvedene vrednosti. NISU javni interfejs role - ne postavljaj ih u
# group_vars ili host_vars. Prefiks donje crte je znak upozorenja.

# Ime paketa i servisa se poklapaju kod obe varijante.
_zabbix_agent_package: "{{ 'zabbix-agent2' if role_zabbix_agent_variant == 'agent2' else 'zabbix-agent' }}"
_zabbix_agent_service: "{{ _zabbix_agent_package }}"

# Glavna konfiguracija koju rola SAMO CITA (radi otkrivanja Include putanje).
_zabbix_agent_main_conf: >-
  {{ '/etc/zabbix/zabbix_agent2.conf'
     if role_zabbix_agent_variant == 'agent2'
     else '/etc/zabbix/zabbix_agentd.conf' }}

# Kljucevi koje rola ispisuje sama. Ako bi se nasli i u recniku, u fajlu bi
# se pojavili dvaput, a dupliran parametar u istom fajlu nema definisano
# ponasanje.
_zabbix_agent_reserved_keys:
  - Server
  - ServerActive
  - Hostname
  - TLSConnect
  - TLSAccept
  - TLSPSKIdentity
  - TLSPSKFile

# Server i ServerActive prihvataju i string i listu; Zabbix ocekuje jednu
# liniju sa vrednostima razdvojenim zarezom.
_zabbix_agent_server_value: >-
  {{ role_zabbix_agent_server | join(',')
     if (role_zabbix_agent_server is sequence and role_zabbix_agent_server is not string)
     else role_zabbix_agent_server }}

_zabbix_agent_server_active_value: >-
  {{ role_zabbix_agent_server_active | join(',')
     if (role_zabbix_agent_server_active is sequence and role_zabbix_agent_server_active is not string)
     else role_zabbix_agent_server_active }}

# TLS se ukljucuje samim postojanjem PSK vrednosti - nema zasebnog prekidaca
# koji bi mogao da se raziđe sa stvarnim stanjem.
_zabbix_agent_tls_enabled: "{{ (role_zabbix_agent_tls_psk | default('') | string | length) > 0 }}"
