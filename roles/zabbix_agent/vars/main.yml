---
# roles/zabbix_agent/vars/main.yml
#
# Izvedene vrednosti. NISU javni interfejs role - ne postavljaj ih u
# group_vars ili host_vars. Prefiks donje crte je znak upozorenja.

# Ime paketa i servisa se poklapaju kod obe varijante.
_zabbix_agent_package: "{{ 'zabbix-agent2' if role_zabbix_agent_variant == 'agent2' else 'zabbix-agent' }}"
_zabbix_agent_service: "{{ _zabbix_agent_package }}"

# Glavna konfiguracija koju rola SAMO CITA (radi otkrivanja Include putanje).
_zabbix_agent_main_conf: >-
  {{ '/etc/zabbix/zabbix_agent2.conf'
     if role_zabbix_agent_variant == 'agent2'
     else '/etc/zabbix/zabbix_agentd.conf' }}

# Kljucevi koje rola ispisuje sama. Ako bi se nasli i u recniku, u fajlu bi
# se pojavili dvaput, a dupliran parametar u istom fajlu nema definisano
# ponasanje.
_zabbix_agent_reserved_keys:
  - Server
  - ServerActive
  - Hostname
  - TLSConnect
  - TLSAccept
  - TLSPSKIdentity
  - TLSPSKFile

# ---------------------------------------------------------------------------
# Sklapanje vrednosti Server i ServerActive
#
# Pravilo je isto za oba parametra:
#   - skalar             -> prepisuje se doslovno (samo se skidaju razmaci)
#   - ravna lista        -> elementi se spajaju ZAREZOM
#   - ugnjezdena lista   -> unutrasnja lista se spaja TACKOM-ZAREZOM,
#                           rezultat ulazi u spoljasnje spajanje zarezom
#
# Razlika u znacenju razdvajaca opisana je u defaults/main.yml. Ovde se samo
# sklapa niska; da li je zapis smislen proverava assert u tasks/main.yml.
#
# Zapis koristi Jinja petlju jer se uslovno spajanje po nivoima ne moze
# izraziti kroz map/join filtere. Oznake {{- i -}} sluze da nijedan prelom
# reda iz ovog fajla ne zavrsi u vrednosti.
# ---------------------------------------------------------------------------

_zabbix_agent_server_value: |-
  {%- if role_zabbix_agent_server is string -%}
  {{- role_zabbix_agent_server | trim -}}
  {%- else -%}
  {%- for entry in role_zabbix_agent_server -%}
  {{- ',' if not loop.first else '' -}}
  {{- entry | map('string') | map('trim') | join(';')
      if (entry is sequence and entry is not string)
      else (entry | string | trim) -}}
  {%- endfor -%}
  {%- endif -%}

_zabbix_agent_server_active_value: |-
  {%- if role_zabbix_agent_server_active is string -%}
  {{- role_zabbix_agent_server_active | trim -}}
  {%- else -%}
  {%- for entry in role_zabbix_agent_server_active -%}
  {{- ',' if not loop.first else '' -}}
  {{- entry | map('string') | map('trim') | join(';')
      if (entry is sequence and entry is not string)
      else (entry | string | trim) -}}
  {%- endfor -%}
  {%- endif -%}

# Regularni izraz koji hvata prazan element u spisku adresa: razdvajac na
# pocetku, na kraju, ili dva razdvajaca zaredom. Nastaje kad se u YAML listu
# potkrade prazan string ili kad se u doslovnom zapisu ostavi zarez visak.
# Zabbix takav zapis ili odbija ili tiho preskace - ni jedno ni drugo se ne
# vidi bez citanja logova.
_zabbix_agent_address_flaw_re: '(^\s*[,;])|([,;]\s*[,;])|([,;]\s*$)'
