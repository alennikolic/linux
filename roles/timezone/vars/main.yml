---
# roles/timezone/vars/main.yml
#
# Izvedene vrednosti. NE menjati kroz inventory.
#
# Prefiks donje crte oznacava da varijable nisu deo javnog interfejsa
# role. Postoje samo da se putanje ne bi ponavljale po taskovima.
#
# Putanje su Debian/Ubuntu. RHEL familija koristi /etc/chrony.conf i
# servis chronyd, pa rola eksplicitno trazi Debian familiju.

_timezone_chrony_package: chrony
_timezone_chrony_service: chrony
_timezone_chrony_config_dir: /etc/chrony
_timezone_chrony_config: /etc/chrony/chrony.conf
