---
# roles/timezone/handlers/main.yml
#
# Handler se poziva iz taskova koji menjaju NTP konfiguraciju.
# Ime servisa se izvodi iz izbora u role_timezone_ntp_service
# (vidi vars/main.yml).

- name: "restart servisa za sinhronizaciju vremena"
  ansible.builtin.service:
    name: "{{ _timezone_ntp.service }}"
    state: restarted
