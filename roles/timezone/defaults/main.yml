---
# roles/timezone/defaults/main.yml
#
# Rola "timezone" radi tri stvari i nista vise:
#
#   1. postavlja vremensku zonu sistema
#   2. instalira chrony i upisuje spisak NTP izvora
#   3. restartuje ono sto mora da se restartuje
#
# Aktivacija ide preko clanstva hosta u grupi [apply_timezone], koja
# kroz group_vars/apply_timezone.yml postavlja role_timezone_enabled.
# Vrednost ispod je samo podrazumevana.
#
# Parametre menjaj u:
#   group_vars/all.yml        — globalno
#   host_vars/<host>.yml      — za pojedinacan host
#
# Rola ne menja sistem nepovratno. Fajl /etc/chrony/chrony.conf se
# upisuje u celosti, ali svaka verzija dobija backup.


# =====================================================================
# AKTIVACIJA
# =====================================================================
# Kada je false, rola ne dira nista.
#
role_timezone_enabled: false


# =====================================================================
# VREMENSKA ZONA
# =====================================================================

# Ime zone po IANA bazi. Spisak dostupnih:
#   timedatectl list-timezones
#
# Rola pre postavljanja proverava da zona postoji u
# /usr/share/zoneinfo. Bez te provere greska u kucanju bi se
# manifestovala kao nejasna poruka iz timedatectl-a. Imena razlikuju
# velika i mala slova: Europe/Belgrade jeste, europe/belgrade nije.
#
# Podrazumevano je Etc/UTC — neutralna vrednost. Stvarnu zonu zadaj
# u group_vars/all.yml, na primer:
#
#   role_timezone_name: Europe/Belgrade
#
role_timezone_name: Europe/Belgrade

# Servisi koje treba restartovati POSLE promene zone.
#
# Neki demoni procitaju TZ jednom, pri pokretanju, i posle promene
# zone nastave da pisu vreme po staroj. Najcesci primeri su cron i
# rsyslog. Vecina systemd servisa ovo resi sama, pa je lista
# podrazumevano prazna.
#
# Restart se izvrsava iskljucivo ako je zona STVARNO promenjena —
# ponovljeno pokretanje role nista ne restartuje.
#
# Servis koji nije instaliran prekida rad role, pa u listu upisuj
# samo ono sto na hostu zaista postoji.
#
#   role_timezone_restart_services:
#     - cron
#     - rsyslog
#
role_timezone_restart_services: []


# =====================================================================
# SINHRONIZACIJA VREMENA (chrony)
# =====================================================================
# Rola uvek instalira chrony i uvek upisuje ceo /etc/chrony/chrony.conf.
# Nema izbora izmedju chrony-ja i systemd-timesyncd — jedan demon,
# jedan fajl, jedno mesto na kome se gleda sta host koristi.

# Spisak NTP izvora. OBAVEZAN — rola prekida rad ako je lista prazna,
# jer bi u suprotnom upisala konfiguraciju bez ijednog izvora i
# ostavila host da tiho ne sinhronizuje vreme.
#
# Interni izvori u zatvorenoj mrezi:
#
#   role_timezone_ntp_servers:
#     - ntp1.example.com
#     - ntp2.example.com
#     - 10.0.0.53
#
# Javni pool (uz role_timezone_ntp_source_type: pool):
#
#   role_timezone_ntp_servers:
#     - 0.pool.ntp.org
#     - 1.pool.ntp.org
#
# VAZNO: sta god ovde upises je JEDINI spisak izvora koji host
# koristi. Podrazumevani Ubuntu izvori, drop-in fajlovi iz
# /etc/chrony/conf.d i izvori koje deli DHCP se ne ucitavaju.
#
role_timezone_ntp_servers:
  - "0.rs.pool.ntp.org"
  - "1.rs.pool.ntp.org"

# Direktiva koja se upisuje ispred svake adrese:
#
#   server  — jedna adresa je jedan izvor. Ovo se koristi za interne
#             NTP servere i uopste za sve sto ima stabilnu adresu.
#
#   pool    — jedno ime se razresava u vise adresa, chrony ih koristi
#             sve. Ima smisla iskljucivo za *.pool.ntp.org i slicne
#             rotirajuce zapise.
#
# Direktiva vazi za CELU listu, pa se javni pool i interni server ne
# mesaju u istoj konfiguraciji. To je namerno — host u produkciji
# treba da ima jedan izvor istine o vremenu.
#
role_timezone_ntp_source_type: server
