---
# roles/timezone/tasks/main.yml
#
# Tok:
#   1. Provere (assert)
#   2. Postavljanje vremenske zone
#   3. Restart servisa koji kesiraju TZ, samo ako je zona promenjena
#   4. chrony: paket, konfiguracija, servis

- name: "Vremenska zona i sinhronizacija vremena"
  block:

    # -----------------------------------------------------------------
    # 1. Provere
    # -----------------------------------------------------------------

    # Rola pise u /etc/chrony/chrony.conf i ocekuje servis "chrony".
    # Na RHEL familiji su i putanja i ime servisa drugaciji, pa nema
    # svrhe pokusavati.
    - name: "Provera podrzane distribucije"
      ansible.builtin.assert:
        that:
          - ansible_os_family | default('') == 'Debian'
        fail_msg: >-
          Rola timezone podrzava samo Debian/Ubuntu sisteme, a
          detektovano je '{{ ansible_os_family | default("nepoznato") }}'.
          Iskljuci rolu za ovaj host kroz host_vars:
          role_timezone_enabled: false
        success_msg: "Distribucija podrzana."

    - name: "Provera da je vremenska zona zadata"
      ansible.builtin.assert:
        that:
          - role_timezone_name is defined
          - role_timezone_name | length > 0
        fail_msg: >-
          role_timezone_name nije popunjen. Zadaj ga u
          group_vars/all.yml, na primer:
          role_timezone_name: Europe/Belgrade
          Spisak dostupnih zona: timedatectl list-timezones
        success_msg: "Zadata zona: {{ role_timezone_name }}"

    # Bolje pasti ovde, sa jasnom porukom, nego upisati chrony.conf
    # bez ijednog izvora i ostaviti host da tiho ne sinhronizuje vreme.
    - name: "Provera da je lista NTP izvora popunjena"
      ansible.builtin.assert:
        that:
          - role_timezone_ntp_servers | length > 0
        fail_msg: >-
          Lista role_timezone_ntp_servers je prazna. Rola upisuje ceo
          /etc/chrony/chrony.conf, pa bi host ostao bez ijednog izvora
          vremena. Upisi bar jedan izvor u group_vars/all.yml ili
          iskljuci rolu za ovaj host.
        success_msg: >-
          Zadato izvora: {{ role_timezone_ntp_servers | length }}

    - name: "Provera tipa NTP izvora"
      ansible.builtin.assert:
        that:
          - role_timezone_ntp_source_type in ['server', 'pool']
        fail_msg: >-
          role_timezone_ntp_source_type mora biti "server" ili "pool",
          a zadato je '{{ role_timezone_ntp_source_type }}'.
        success_msg: "Tip izvora: {{ role_timezone_ntp_source_type }}"

    # Provera da zona uopste postoji. timedatectl bi u suprotnom
    # prijavio gresku bez naznake koja je vrednost pogresna.
    - name: "Provera da zona postoji u /usr/share/zoneinfo"
      ansible.builtin.stat:
        path: "/usr/share/zoneinfo/{{ role_timezone_name }}"
      register: _timezone_zoneinfo
      changed_when: false

    - name: "Potvrda da je zona poznata sistemu"
      ansible.builtin.assert:
        that:
          - _timezone_zoneinfo.stat.exists
        fail_msg: >-
          Zona '{{ role_timezone_name }}' ne postoji u
          /usr/share/zoneinfo na ovom hostu. Proveri kucanje — imena
          razlikuju velika i mala slova (Europe/Belgrade, ne
          europe/belgrade). Spisak: timedatectl list-timezones
        success_msg: "Zona postoji u bazi."

    # -----------------------------------------------------------------
    # 2. Vremenska zona
    # -----------------------------------------------------------------
    # Modul je idempotentan: poredi trenutnu zonu i menja je samo ako
    # se razlikuje. hwclock se namerno ne dira — u virtuelnim masinama
    # postavljanje te vrednosti zna da padne, a korist je nikakva.

    - name: "Postavljanje vremenske zone na {{ role_timezone_name }}"
      community.general.timezone:
        name: "{{ role_timezone_name }}"
      register: _timezone_set

    # -----------------------------------------------------------------
    # 3. Servisi koji kesiraju TZ
    # -----------------------------------------------------------------
    # Uslov "is changed" je bitan — bez njega bi svako pokretanje role
    # restartovalo cron i rsyslog bez potrebe.

    - name: "Restart servisa posle promene zone"
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ role_timezone_restart_services }}"
      when:
        - _timezone_set is changed
        - role_timezone_restart_services | length > 0

    # -----------------------------------------------------------------
    # 4. chrony
    # -----------------------------------------------------------------

    - name: "Instalacija paketa {{ _timezone_chrony_package }}"
      ansible.builtin.apt:
        name: "{{ _timezone_chrony_package }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Folder pravi paket, ali u --check rezimu paket nije instaliran
    # pa ga nema. Bez ovog taska bi template ispod prijavio nejasnu
    # gresku umesto ocekivane razlike.
    - name: "Folder {{ _timezone_chrony_config_dir }} postoji"
      ansible.builtin.file:
        path: "{{ _timezone_chrony_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # Ceo fajl, ne drop-in. Drop-in samo DODAJE izvore na one iz
    # osnovnog fajla, pa host pored zadatih koristi i podrazumevane
    # Ubuntu izvore — u zatvorenoj mrezi to su samo nepotrebna
    # cekanja, a u svakoj drugoj nejasna slika o tome odakle dolazi
    # vreme.
    - name: "Upis konfiguracije u {{ _timezone_chrony_config }}"
      ansible.builtin.template:
        src: chrony.conf.j2
        dest: "{{ _timezone_chrony_config }}"
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: "restart chrony"

    - name: "Servis {{ _timezone_chrony_service }} pokrenut i ukljucen"
      ansible.builtin.service:
        name: "{{ _timezone_chrony_service }}"
        state: started
        enabled: true

  when: role_timezone_enabled | default(false) | bool
